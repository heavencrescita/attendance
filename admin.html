<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BWC Attendance Admin</title>
<style>
:root{--yellow:#fff200;--black:#0d0d0d;--teal:#27bdbe;--bg:#f5f5f0;--card:#fff;--ink:#151515;--muted:#6b6b66;--line:#e4e4dc;--chip:#f0f0ea;
--c1:#1a9fa0;--c2:#5b5bd6;--ok:#1a7f37;--ok-bg:#e6f4ea;--warn:#9a5b00;--warn-bg:#fff4dc;--bad:#b4232b;--bad-bg:#fde8e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#1fa8a9;--c2:#7b7be6;--bg:#121212;--card:#1c1c1b;--ink:#f2f2ee;--muted:#a3a39b;--line:#2e2e2b;--chip:#262624;--ok-bg:#16301f;--warn-bg:#33270f;--bad-bg:#3a1a1c;--ok:#5fd17f;--warn:#f0b445;--bad:#ff7a80}}
:root[data-theme="dark"]{--c1:#1fa8a9;--c2:#7b7be6;--bg:#121212;--card:#1c1c1b;--ink:#f2f2ee;--muted:#a3a39b;--line:#2e2e2b;--chip:#262624;--ok-bg:#16301f;--warn-bg:#33270f;--bad-bg:#3a1a1c;--ok:#5fd17f;--warn:#f0b445;--bad:#ff7a80}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
button,input,select{font:inherit;color:inherit}
.top{background:var(--black);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:50%;background:var(--yellow);border:3px solid var(--teal);display:grid;place-items:center;font-weight:800;color:#000;font-size:11px;flex:none}
.top h1{font-size:16px;margin:0;color:var(--yellow)} .top .sub{font-size:12px;color:#bdbdb5}
.top .sp{flex:1}
.top input[type=month]{background:#262626;border:1px solid #3a3a3a;border-radius:8px;padding:5px 8px;color:#fff}
.pill{font-size:12px;padding:5px 10px;border-radius:999px;background:#262626;color:#e8e8e2;border:0;cursor:pointer}
.pill b{color:var(--yellow)}
nav{display:flex;gap:2px;padding:0 20px;background:var(--black);overflow-x:auto;border-top:1px solid #222}
nav button{background:none;border:0;color:#cfcfc8;padding:11px 13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav button.on{color:#fff;border-bottom-color:var(--yellow)}
nav .n{background:var(--yellow);color:#000;border-radius:999px;padding:0 6px;font-size:11px;margin-left:6px;font-weight:700}
main{max-width:1280px;margin:0 auto;padding:20px}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpis5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.dl{display:inline-block;margin-left:4px;font-weight:600;color:var(--muted)}.dl.g{color:var(--ok)}.dl.b{color:var(--bad)}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mchips{display:flex;gap:6px;flex-wrap:wrap}.mchips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}.mchips button.on{background:var(--black);color:var(--yellow);border-color:var(--black)}
.btn.act{background:var(--warn-bg);color:var(--warn)}
.three{grid-template-columns:repeat(3,1fr)}@media(max-width:1000px){.three{grid-template-columns:1fr}}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-left:10px}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sbar{display:flex;gap:2px;height:12px;align-items:stretch}.sbar i{display:block;border-radius:0 4px 4px 0}.sbar i:first-child{border-radius:4px}
.rank td{padding:7px 8px}
.cols{display:flex;align-items:flex-end;gap:4px;padding-top:4px}.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;cursor:default}
.col i{display:block;width:70%;max-width:46px;background:var(--c1);border-radius:4px 4px 0 0}.col.on i{background:var(--c2)}.col.ghost i{opacity:.45}.col:hover i{filter:brightness(1.12)}
.col .cv{font-size:11px;color:var(--ink);font-weight:600;margin-bottom:3px;white-space:nowrap}.col .ck{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;height:14px}
.heat{border-collapse:separate;border-spacing:2px}.heat th,.heat td{padding:0;border:0;text-align:center;font-size:11px}.heat th{font-weight:600;line-height:1.15;padding:2px 0;min-width:24px}.heat th span{font-weight:400;color:var(--muted)}.heat th.we{color:var(--c2)}
.heat td:first-child,.heat th:first-child{text-align:left;padding-right:10px;font-size:12.5px}.heat td.hc{width:24px;height:24px;border-radius:4px;background:rgba(26,159,160,var(--a));color:var(--ink)}
.heat tr.tot td{color:var(--muted);font-weight:600;padding-top:4px}.heat td.num{padding-left:8px}

.two{grid-template-columns:1.4fr 1fr}@media(max-width:900px){.two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}.kpi .v{font-size:26px;font-weight:800;margin-top:4px}.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.kpi.accent{border-left:5px solid var(--teal)}
.matrix th.c,.matrix td.c{text-align:center;padding:6px 4px}.matrix th.c{font-size:11px;max-width:80px;white-space:normal}.matrix input{width:18px;height:18px}.matrix tr.sum td{border-top:2px solid var(--line);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}.chip input{width:auto;margin:0}
h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card);z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--chip)} tr.click{cursor:pointer}
.scroll{overflow:auto;max-height:68vh}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-mute{background:var(--chip);color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],input[type=date],select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
input.mini{width:58px;text-align:right;padding:3px 6px}
.btn{border:0;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--chip);white-space:nowrap}
.btn.y{background:var(--yellow);color:#000}.btn.t{background:var(--teal);color:#fff}.btn.r{background:var(--bad-bg);color:var(--bad)}.btn.g{background:var(--ok-bg);color:var(--ok)}
.btn:disabled{opacity:.5}
.muted{color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;line-height:1.45}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50}.drawer.on{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(540px,100%);background:var(--card);padding:20px;overflow:auto}
.steps{display:grid;gap:8px;margin-top:10px}
.step{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.step .f{font-size:12px;color:var(--muted);margin-top:2px}.step.total{border:2px solid var(--teal)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.form label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.flag{display:grid;grid-template-columns:150px 1fr;gap:14px}
.selfie{width:150px;height:140px;border-radius:10px;background:var(--chip);display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;overflow:hidden;cursor:pointer}
.selfie img{width:100%;height:100%;object-fit:cover}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
#login{max-width:380px;margin:60px auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90vw}
.loading{opacity:.5;pointer-events:none}
.pins td{font-size:15px}
@media print{.top,nav,.noprint{display:none!important}main{padding:0}.card{border:0}}
@media(max-width:640px){main{padding:14px}.top{padding:10px 14px}nav{padding:0 6px}.kpi .v{font-size:22px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()"><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzZzIRS-eO9MykhaJ9MEnDy32U5HEWOyf_WioqUlzUulfICsZ1Gm6ohePmuBmDYdAKx/exec';
// BWC payroll engine — mirrors the formulas in BWC_Payroll_Sep2026_FINAL_v3.xlsx (SEP-26 PAYROLL sheet).
//  Days worked : shift > halfDayHrs (4 h) = 1 day, 0 < shift ≤ 4 h = ½ day
//  Week-off    : W/O eligible → credit days = min(WkOff, days ≥ workDays ? WkOff : INT((days+1)/7)); hours = days × duty
//  Rate / hr   : eligible → plan ÷ (calDays × duty); not eligible → dailyRate ÷ duty
//  FIXED       : base = plan ÷ workDays × min(days, workDays); no OT
//  HOURLY      : hours = clocked + credit; OT hrs = max(0, clocked − workDays × duty); base = rate × (hours − OT); OT pay = OT × rate × otMultiplier
//  NET         : Inactive → 0, else ROUND((base + OT + additions − deductions) ÷ 10) × 10 (Excel rounding); negative NET carries forward
const COUNTED = ['ACCEPTED', 'APPROVED', 'MANUAL'];
const MAX_SHIFT_MS = 24 * 3600000;   // must match OPEN_SHIFT_MAX_H in Code.gs
const LONG_SHIFT_H = 20;

function istParts(iso) { return { date: iso.slice(0, 10), time: iso.slice(11, 16) }; }

// The 6:00am shift gets a 10-minute grace at clock-in: punching in anywhere from 06:00 to 06:10 still pays as if
// they clocked in at 06:00 exactly. hm is the punch's local "HH:MM"; returns the epoch to use for hours worked.
function graceAdjustEpoch_(epoch, hm) {
  const m = /^06:(0[0-9]|10)$/.exec(hm || '');
  return m ? epoch - Number(m[1]) * 60000 : epoch;
}

// Self-service punch-out stays open until 4:00am (PUNCHOUT_CUTOFF_HM in Code.gs) so closing-up time
// doesn't lock staff into a missed-punchout request, but hours worked still stop counting at 3:00am —
// an OUT anywhere from 03:00 up to the 4am cutoff is paid as if it happened at 03:00 exactly. dateStr/hm
// are the OUT punch's local date/"HH:MM"; returns the epoch to use for hours worked.
function capOutEpoch_(dateStr, hm, epoch) {
  const m = /^(\d{2}):(\d{2})$/.exec(hm || ''); if (!m) return epoch;
  const mins = Number(m[1]) * 60 + Number(m[2]);
  return (mins >= 180 && mins < 240) ? new Date(dateStr + 'T03:00:00+05:30').getTime() : epoch;
}

// Pair punches into shifts for one employee. Returns {shifts, issues}.
function buildShifts(punches, now) {
  now = now || Date.now();
  const ps = punches.filter(p => COUNTED.includes(p.status)).sort((a, b) => Number(a.epoch) - Number(b.epoch));
  const shifts = [], issues = []; let open = null;
  for (const p of ps) {
    if (p.type === 'IN') {
      if (open) issues.push({ kind: 'Missing OUT', punch: open });
      open = p;
    } else {
      if (open && Number(p.epoch) - Number(open.epoch) <= MAX_SHIFT_MS) {
        const i = istParts(open.time), o = istParts(p.time);
        shifts.push({ date: i.date, day: Number(i.date.slice(8, 10)), in: i.time, out: o.time + (o.date !== i.date ? ' +1' : ''),
          hours: (capOutEpoch_(o.date, o.time, Number(p.epoch)) - graceAdjustEpoch_(Number(open.epoch), i.time)) / 3600000, store: open.store, inPunch: open, outPunch: p });
        if ((Number(p.epoch) - Number(open.epoch)) / 3600000 > LONG_SHIFT_H) issues.push({ kind: 'Very long shift — check', punch: open, counted: true });
        open = null;
      } else issues.push({ kind: 'OUT without IN', punch: p });
    }
  }
  if (open) issues.push({ kind: now - Number(open.epoch) > MAX_SHIFT_MS ? 'Missing OUT' : 'On shift now', punch: open });
  return { shifts, issues };
}

// Imported (Excel) shifts → same shape as punched shifts
function importedShifts(rows) {
  return rows.map(r => ({ date: r.date, day: Number(String(r.date).slice(8, 10)), in: r.inT, out: r.outT, hours: Number(r.hours), store: r.branch, imported: true }));
}

function daysInMonth(month) { const [y, m] = month.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function addMonths(month, n) { const y = Number(month.slice(0, 4)), m0 = Number(month.slice(5, 7)) - 1 + n; return (y + Math.floor(m0 / 12)) + '-' + String(((m0 % 12) + 12) % 12 + 1).padStart(2, '0'); }
// Payroll periods run the 15th of one month through the 14th of the next, named for the month they END
// in — period "2026-10" is 15 Sep through 14 Oct 2026 (30 days). Mirrors periodBounds_/periodOf_ in Code.gs.
function periodRange(month) {
  const startDate = addMonths(month, -1) + '-15', endDate = month + '-14';
  const start = new Date(startDate + 'T00:00:00+05:30').getTime(), end = new Date(month + '-15T00:00:00+05:30').getTime();
  return { startDate, endDate, start, end, days: Math.round((end - start) / 86400000) };
}
function periodOf(ymd) { const mo = String(ymd).slice(0, 7), day = Number(String(ymd).slice(8, 10)); return day >= 15 ? addMonths(mo, 1) : mo; }
function excelRound(x) { return Math.sign(x) * Math.round(Math.abs(x) + 1e-9); }
// Count distinct accepted Week Off days a manager planned for this employee, within the payroll period.
// Planner dates are the source of truth once any exist for that employee in-period — they override both
// the admin monthly override (WeekOff sheet) and the rule-based auto-calc below.
function weekOffDaysFromPlanner(plannerShifts, empId, pr) {
  const days = new Set();
  (plannerShifts || []).forEach(s => { if (s.empId === empId && s.type === 'WEEKOFF' && s.status === 'ACCEPTED' && s.date >= pr.startDate && s.date <= pr.endDate) days.add(s.date); });
  return days.size;
}

// e: employee row; shifts: that employee's shifts dated inside the month; ctx: {month, cfg, ded, add, weekOff, plannerShifts}
function calcPay(e, shifts, ctx) {
  // calDays: pass ctx.calDays explicitly once the caller knows whether this month was paid on the old
  // calendar-month convention or the new 15th–14th cycle (Code.gs computes this from V9Ref history).
  // Falls back to plain calendar days of the named month when not given — e.g. in tests against months
  // that predate the 15th–14th cycle, where that's exactly the right (and only ever used) convention.
  const cfg = ctx.cfg, calDays = ctx.calDays != null ? Number(ctx.calDays) : daysInMonth(ctx.month), workDays = calDays - Number(cfg.weekOffsPerMonth || 4);
  const halfH = Number(cfg.halfDayHrs || 4), otMult = Number(cfg.otMultiplier || 1);
  const duty = Number(e.duty) || 9, plan = Number(e.plan) || 0;
  const worked = shifts.filter(x => x.hours > 0);
  const clockH = worked.reduce((s, x) => s + x.hours, 0);
  const halfDays = worked.filter(x => x.hours <= halfH).length;
  const days = worked.length - 0.5 * halfDays;
  const eligible = e.woEligible !== 'No';
  const woMax = e.woDays === '' || e.woDays == null ? Number(cfg.weekOffsPerMonth || 4) : Number(e.woDays);
  const rate = eligible ? plan / (calDays * duty) : (Number(e.dailyRate) || plan / calDays) / duty;
  const wo = (ctx.weekOff || []).find(w => w.empId === e.id);
  const ruleCredit = eligible ? Math.min(woMax, days >= workDays ? woMax : Math.floor((days + 1) / 7)) : 0;
  const pr = periodRange(ctx.month);
  const plannedWO = ctx.plannerShifts ? weekOffDaysFromPlanner(ctx.plannerShifts, e.id, pr) : 0;
  const hasPlannerData = ctx.plannerShifts && (ctx.plannerShifts || []).some(s => s.empId === e.id && s.type === 'WEEKOFF' && s.date >= pr.startDate && s.date <= pr.endDate);
  const creditDays = hasPlannerData ? plannedWO : (wo ? Number(wo.days) : ruleCredit);
  const creditSource = hasPlannerData ? 'planned (' + plannedWO + ' days)' : wo ? 'set by ' + wo.setBy : (eligible ? 'rule' : 'not eligible');
  const creditH = creditDays * duty;
  const active = e.status === 'Active';
  let base = 0, otH = 0, otPay = 0, basis;
  if (e.payType === 'FIXED') {
    base = active ? plan / workDays * Math.min(days, workDays) : 0;
    basis = `₹${inr(plan)} ÷ ${workDays} × min(${days}, ${workDays})`;
  } else {
    const hrs = clockH + creditH, expH = workDays * duty;
    otH = Math.max(0, clockH - expH);
    base = active ? rate * (hrs - otH) : 0;
    otPay = active ? otH * rate * otMult : 0;
    basis = `(${clockH.toFixed(2)} h + ${creditH} h week-off − ${otH.toFixed(2)} h OT) × ₹${rate.toFixed(2)}/h`;
  }
  const ded = (ctx.ded || []).filter(x => x.empId === e.id), add = (ctx.add || []).filter(x => x.empId === e.id);
  const dedT = ded.reduce((s, x) => s + Number(x.amount), 0), addT = add.reduce((s, x) => s + Number(x.amount), 0);
  const gross = base + otPay + addT - dedT;
  const net = active ? excelRound(gross / 10) * 10 : 0;
  return { workH: clockH, days, halfDays, calDays, workDays, rate, creditDays, creditSource, creditH, eligible, base, otH, otPay, basis,
    ded, add, dedT, addT, gross, net, payable: Math.max(0, net), carry: Math.max(0, -net) };
}
function inr(n) { return Math.round(n).toLocaleString('en-IN'); }
// Some staff cover a shortage at another outlet mid-month, or have simply moved outlets while the
// roster still lists their old one. Base+OT pay should land on whichever branch they actually clocked
// hours at, not on a home branch that may be stale — split across branches when they worked more than
// one. Returns null only when there's no attendance this month at all (then the roster's home branch is
// the only information there is); otherwise always reflects the attendance, even for a single branch.
function branchSplit(shifts) {
  const by = {}; let tot = 0;
  (shifts || []).filter(s => s.hours > 0 && s.store).forEach(s => { by[s.store] = (by[s.store] || 0) + s.hours; tot += s.hours; });
  if (!tot) return null;
  return Object.keys(by).map(b => ({ branch: b, hrs: by[b], frac: by[b] / tot })).sort((a, b) => b.frac - a.frac);
}
if (typeof module !== 'undefined') module.exports = { buildShifts, importedShifts, calcPay, daysInMonth, branchSplit, graceAdjustEpoch_, periodRange, periodOf, capOutEpoch_, weekOffDaysFromPlanner };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = n => (n < 0 ? '−₹' : '₹') + Math.abs(Math.round(n)).toLocaleString('en-IN');
const store = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } };
const CATS_D = ['COMPLAINT', 'UNI/HYG/TRNG', 'DISCIPLINE', 'ADVANCE', 'T-SHIRT/EQUIP', 'CASH SHORT', 'OTHER'];
const CATS_A = ['BONUS', 'INCENTIVE', 'Accident Coverage', 'ARREARS', 'OTHER'];
const nowMonth = () => periodOf(new Date(Date.now() + 5.5 * 3600000).toISOString().slice(0, 10));
const addDay = ymd => new Date(new Date(ymd + 'T12:00:00+05:30').getTime() + 86400000).toISOString().slice(0, 10);
let ST = { token: store('bwc_tok'), month: store('bwc_month') || nowMonth(), tab: 'overview', day: null, branch: 'ALL', D: null, selfies: {} };

async function api(body, quiet) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ token: ST.token }, body)) });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') { ST.token = null; store('bwc_tok', null); renderLogin('Session expired — sign in again'); throw new Error('Session expired'); }
    throw new Error(j.error || 'Request failed');
  }
  return j;
}
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.style.background = bad ? 'var(--bad)' : 'var(--black)'; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }
async function act(body, okMsg) { try { const r = await api(body); if (okMsg) toast(okMsg); await load(); return r; } catch (e) { toast(e.message, true); throw e; } }

/* ---------------- LOGIN ---------------- */
function renderLogin(msg) {
  $('#app').innerHTML = `<div id="login" class="card">
    <div class="row" style="margin-bottom:14px"><div class="logo">BWC</div><div><b>The Belgian Waffle Cafe</b><div class="muted">Attendance &amp; payroll admin</div></div></div>
    <label class="muted">User name<input type="text" id="lu" autocomplete="username"></label><br>
    <label class="muted">Password<input type="password" id="lp" autocomplete="current-password"></label>
    <button class="btn y" style="width:100%;margin-top:14px;padding:11px" id="lb" onclick="doLogin()">Sign in</button>

async function load() {

function derive() {
  const D = ST.D;

  D.storeName = Object.fromEntries(D.stores.map(s => [s.code, s.name])); D.storeName.MGR = 'Managers (roaming)';
  D.byEmp = {}; D.issues = [];
  D.employees.forEach(e => {
    const b = buildShifts(D.punches.filter(p => p.empId === e.id));
    b.inMonth = b.shifts.filter(s => periodOf(s.date) === D.month)
      .concat(importedShifts((D.importedShifts || []).filter(r => r.empId === e.id))).sort((x, y) => (x.date + x.in).localeCompare(y.date + y.in));
    D.byEmp[e.id] = b;

  D.v9 = Object.fromEntries((D.v9Ref || []).map(v => [v.empId, v]));
  // For an imported month, pay each person on the terms they had that month (salary, branch, status), not today's
  const asOf = e => { const v = D.v9[e.id]; if (!v || v.plan === '' || v.plan == null) return e;
    return Object.assign({}, e, { name: v.name || e.name, branch: v.branch || e.branch, payType: v.payType || e.payType, plan: Number(v.plan), duty: Number(v.duty) || e.duty,

  D.pay = D.employees.map(e => ({ e: asOf(e), r: calcPay(asOf(e), D.byEmp[e.id].inMonth, { month: D.month, cfg: D.config, ded: D.deductions, add: D.additions, weekOff: D.weekOff, calDays: D.calDays, plannerShifts: D.shifts }), branchSplit: branchSplit(D.byEmp[e.id].inMonth) }));
  D.hasV9 = (D.v9Ref || []).length > 0;
  D.unmatched = (D.importedShifts || []).filter(r => !r.empId);
  D.pay.forEach(x => { const v = D.v9[x.e.id]; x.v9 = v ? Number(v.net) : null; });
  D.notInV9 = D.hasV9 ? D.pay.filter(x => x.v9 === null && x.r.net !== 0) : [];
  D.v9Match = D.pay.filter(x => x.v9 !== null && x.v9 === x.r.net).length;
  derivePlan();
  const today = new Date(Date.now() + 5.5 * 3600000).toISOString().slice(0, 10);
  const pr = D.periodStart && D.periodEnd ? { startDate: D.periodStart, endDate: D.periodEnd } : periodRange(D.month);
  if (!ST.day || ST.day < pr.startDate || ST.day > pr.endDate) ST.day = (today >= pr.startDate && today <= pr.endDate) ? today : pr.startDate;
}
const branchName = c => (ST.D.storeName[c] || c);
const ampm_ = hm => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(hm || '').trim()); if (!m) return hm || ''; let h = +m[1]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + m[2] + ' ' + ap; };
const LATE_GRACE_MIN = 10;
// Planned vs actual (report only — pay is still calculated from punches)
function derivePlan() {
  const D = ST.D, now = Date.now();
  const plan = (D.shifts || []).filter(s => s.status !== 'CANCELLED');
  const work = plan.filter(s => !s.type || s.type === 'WORK');
  const dayOff = plan.filter(s => s.type === 'WEEKOFF' || s.type === 'LEAVE');
  const ins = D.punches.filter(p => p.type === 'IN' && p.status !== 'REJECTED');
  const used = new Set();
  const rows = work.map(s => {
    const st = Date.parse(s.date + 'T' + s.start + ':00+05:30'), dur = Number(s.hours) * 3600000, en = st + dur;
    const cand = ins.filter(p => p.empId === s.empId && !used.has(p.punchId) && Number(p.epoch) > st - 4 * 3600000 && Number(p.epoch) < st + 8 * 3600000)
      .sort((a, b) => Math.abs(a.epoch - st) - Math.abs(b.epoch - st))[0];
    let res, late = 0, out = '';
    if (cand) {
      used.add(cand.punchId); late = Math.round((Number(cand.epoch) - st) / 60000);
      res = late > LATE_GRACE_MIN ? 'Late' : 'On time';
      const sh = (D.byEmp[s.empId] || { shifts: [] }).shifts.find(x => x.inPunch && x.inPunch.punchId === cand.punchId); out = sh ? sh.out : '';
    } else res = st > now ? 'Upcoming' : en > now ? 'Not in yet' : 'No-show';
    return { s, st, inPunch: cand, late, out, res };
  }).sort((a, b) => a.st - b.st);
  const dayOffRows = dayOff.map(s => ({ s, st: Date.parse(s.date + 'T00:00:00+05:30'), inPunch: null, late: 0, out: '', res: s.status === 'REJECTED' ? 'Rejected' : '' })).sort((a, b) => a.st - b.st);
  const planned = new Set(work.map(s => s.empId + '|' + s.date));
  const planStores = new Set(work.map(s => s.store));
  const unplanned = ins.filter(p => !used.has(p.punchId) && planStores.has(p.store) && !planned.has(p.empId + '|' + String(p.time).slice(0, 10)) && periodOf(String(p.time).slice(0, 10)) === D.month);
  D.plan = { rows: rows.concat(dayOffRows).sort((a, b) => a.st - b.st), unplanned };
}

// Payslips reach staff in My BWC only after a month is released here
function releaseCard() {
  const D = ST.D; if (D.role !== 'admin' && D.role !== 'hr') return '';
  const rel = (D.releases || []).find(r => r.month === D.month), closed = D.month < periodOf(D.now.slice(0, 10));
  if (rel) return `<div class="card" style="margin-bottom:14px;border-left:4px solid var(--ok)"><div class="row"><div><b>Payslips released to staff</b><div class="muted">${esc(D.monthLabel)} · released by ${esc(rel.releasedBy)} on ${String(rel.releasedAt).slice(0, 16).replace('T', ' ')}. Staff see these figures in My BWC.</div></div><div class="sp"></div><button class="btn" onclick="withdrawRelease()">Withdraw</button></div></div>`;
  return `<div class="card" style="margin-bottom:14px;border-left:4px solid var(--warn)"><div class="row"><div><b>Not released to staff</b><div class="muted">${closed ? `Staff see their ${esc(D.monthLabel)} attendance but no pay. Release once the payout is done — ${D.hasV9 ? 'the imported payroll figures' : 'the figures on this page'} become their payslips.` : `${esc(D.monthLabel)} is still running. Pay can be released after the month closes.`}</div></div><div class="sp"></div>${closed ? `<button class="btn g" onclick="releasePay()">Release payslips</button>` : ''}</div></div>`;
}
async function releasePay() {
  const D = ST.D;
  const rows = D.hasV9 ? [] : D.pay.filter(x => x.e.status === 'Active' || x.r.days > 0).map(({ e, r }) => ({ empId: e.id, name: e.name, branch: e.branch, payType: e.payType, plan: e.plan, duty: e.duty, status: e.status,
    woEligible: e.woEligible, woDays: e.woDays, dailyRate: e.dailyRate, net: r.payable, base: Math.round(r.base * 100) / 100, ot: Math.round(r.otPay * 100) / 100, ded: r.dedT, add: r.addT, days: r.days, hrs: Math.round(r.workH * 100) / 100 }));
  if (!D.hasV9 && (D.flagged.length || D.issues.some(i => i.kind === 'Missing OUT')) && !confirm('There are flagged punches or missing OUTs that are not in these figures. Release anyway?')) return;
  if (!confirm(`Release ${D.monthLabel} payslips to all staff? They will see these figures in My BWC.`)) return;
  await act({ action: 'releaseMonth', month: D.month, rows }, 'Released to staff');
}
async function withdrawRelease() { if (confirm(`Hide ${ST.D.monthLabel} payslips from staff again?`)) await act({ action: 'releaseMonth', month: ST.D.month, release: false }, 'Withdrawn'); }
function pay() {
  const D = ST.D, b = ST.branch;
  const R = D.pay.filter(x => (b === 'ALL' || x.e.branch === b) && (x.e.status === 'Active' || x.r.days > 0 || (D.v9[x.e.id] && Number(D.v9[x.e.id].net))));
  const sum = k => R.reduce((s, x) => s + x.r[k], 0);
  const missing = D.issues.filter(i => i.kind === 'Missing OUT').length;
  $('#main').innerHTML = `
  ${releaseCard()}
  ${missing || D.flagged.length ? `<div class="note">${D.flagged.length} flagged punch(es) and ${missing} missing OUT(s) are <b>not</b> in these numbers yet. <a href="#" onclick="go('flags');return false">Review →</a></div>` : ''}
  <div class="grid kpis">
    <div class="card kpi accent"><div class="l">NET payable · ${b === 'ALL' ? 'all branches' : esc(branchName(b))}</div><div class="v">${rs(sum('net'))}</div><div class="s">${esc(D.monthLabel)}</div></div>
    <div class="card kpi"><div class="l">Base pay</div><div class="v">${rs(sum('base'))}</div></div>
    <div class="card kpi"><div class="l">Deductions</div><div class="v">${rs(sum('dedT'))}</div></div>
    <div class="card kpi"><div class="l">OT pay</div><div class="v">${rs(sum('otPay'))}</div></div>
    <div class="card kpi"><div class="l">Additions</div><div class="v">${rs(sum('addT'))}</div></div>
    ${D.hasV9 ? `<div class="card kpi"><div class="l">V9 NET · same filter</div><div class="v">${rs(R.reduce((s, x) => s + (x.v9 || 0), 0))}</div><div class="s">${R.filter(x => x.v9 !== null && x.v9 === x.r.net).length} of ${R.filter(x => x.v9 !== null).length} match</div></div>` : ''}</div>
  <div class="card" style="margin-top:14px">
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0">Payroll · ${esc(D.monthLabel)}</h2><div class="sp"></div>
      <div style="width:200px">${branchSelect(b, "ST.branch=this.value;render()")}</div>
      <button class="btn t" onclick="exportAttendance()">Attendance CSV (V9 format)</button><button class="btn t" onclick="exportPayroll()">Payroll CSV</button></div>
    <div class="scroll"><table><thead><tr><th>WAFF ID</th><th>Name</th><th>Branch</th><th>Type</th><th class="num">Days</th><th class="num">Hours</th><th class="num">Week-off days</th><th class="num">Base</th><th class="num">OT</th><th class="num">Deductions</th><th class="num">Additions</th><th class="num">NET</th>${D.hasV9 ? '<th class="num">V9 NET</th>' : ''}<th>Notes</th></tr></thead><tbody>
    ${R.map(({ e, r, branchSplit: bs }) => `<tr class="click" onclick="if(event.target.tagName!=='INPUT')showCalc('${e.id}')"><td>${e.id}</td><td><b>${esc(e.name)}</b></td><td>${esc(branchName(e.branch))}${bs && bs.length > 1 ? ` <span class="tag t-mute" title="${bs.map(a => branchName(a.branch) + ' ' + (a.frac * 100).toFixed(0) + '%').join(' · ')}">split</span>` : (bs && bs[0].branch !== e.branch ? ` <span class="tag t-warn" title="Roster says ${esc(branchName(e.branch))}; attendance this month is all at ${esc(branchName(bs[0].branch))}">moved?</span>` : '')}</td><td>${e.payType}</td>
      <td class="num">${r.days}</td><td class="num">${r.workH.toFixed(1)}</td>
      <td class="num">${r.eligible ? `<input class="mini" type="number" min="0" max="8" value="${r.creditDays}" onchange="setWO('${e.id}',this.value)" title="${r.creditSource}"> ${r.creditSource === 'rule' ? '' : '<span class="tag t-mute">manual</span>'}` : '<span class="muted">—</span>'}</td>
      <td class="num">${rs(r.base)}</td><td class="num">${r.otPay ? rs(r.otPay) : '<span class="muted">—</span>'}</td><td class="num">${r.dedT ? rs(r.dedT) : '<span class="muted">—</span>'}</td><td class="num">${r.addT ? rs(r.addT) : '<span class="muted">—</span>'}</td>
      <td class="num"><b style="${r.net < 0 ? 'color:var(--bad)' : ''}">${rs(r.net)}</b></td>
      ${D.hasV9 ? `<td class="num">${x9(e.id, r.net)}</td>` : ''}
      <td>${e.status !== 'Active' && r.days ? '<span class="tag t-bad">Inactive but worked</span>' : ''}${r.net < 0 ? '<span class="tag t-bad">Negative</span>' : ''}${!e.hasPin && e.status === 'Active' ? '<span class="tag t-mute">no PIN</span>' : ''}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function x9(id, net) {
  const v = ST.D.v9[id];
  if (!v) return net ? '<span class="tag t-bad">not in V9</span>' : '<span class="muted">—</span>';
  const n = Number(v.net);
  return n === net ? `<span class="tag t-ok">${rs(n)} ✓</span>` : `<span class="tag t-warn">${rs(n)}</span>`;
}
function setWO(id, v) { act({ action: 'setWeekOff', empId: id, month: ST.D.month, days: Number(v) }, 'Week-off days saved'); }
function showCalc(id) {
  const D = ST.D, x = D.pay.find(p => p.e.id === id), e = x.e, r = x.r, sh = D.byEmp[id].inMonth, bs = x.branchSplit;
  openDrawer(`<div class="row"><div><h2 style="margin:0">${esc(e.name)}</h2><div class="muted">${e.id} · ${esc(branchName(e.branch))} · ${e.payType} · ${e.status}</div></div><div class="sp"></div><button class="btn" onclick="closeDrawer()">Close</button></div>
    ${bs && bs.length > 1 ? `<div class="note" style="margin-top:10px">Worked multiple branches this month — base pay + OT (₹${rs(r.base + r.otPay)}) is split by hours: ${bs.map(a => `<b>${esc(branchName(a.branch))}</b> ${(a.frac * 100).toFixed(0)}% (₹${rs((r.base + r.otPay) * a.frac)})`).join(' · ')}</div>` : (bs && bs[0].branch !== e.branch ? `<div class="note" style="margin-top:10px">Roster lists <b>${esc(branchName(e.branch))}</b> but every clocked hour this month was at <b>${esc(branchName(bs[0].branch))}</b> — that's where this pay is attributed in Branch Summary.</div>` : '')}
    <div class="steps">
      <div class="step"><div>Shifts worked<div class="f">${sh.length} shifts, ${r.halfDays} of ${D.config.halfDayHrs} h or less counted as ½ day${sh.some(s => s.imported) ? ' · from V9 attendance' : ''}</div></div><b>${r.days} days</b></div>
      <div class="step"><div>Hours on shift</div><b>${r.workH.toFixed(2)} h</b></div>
      <div class="step"><div>Rate per hour<div class="f">${r.eligible ? rs(e.plan) + ' ÷ (' + r.calDays + ' days × ' + e.duty + ' h)' : 'daily rate ' + rs(e.dailyRate) + ' ÷ ' + e.duty + ' h (no paid week-off)'}</div></div><b>₹${r.rate.toFixed(2)}</b></div>
      ${e.payType === 'HOURLY' ? `<div class="step"><div>Paid week-off credit<div class="f">${r.creditDays} day(s) × ${e.duty} h · ${r.eligible ? r.creditSource : 'not eligible'}</div></div><b>${r.creditH} h</b></div>` : ''}
      <div class="step"><div>Base pay<div class="f">${r.basis}</div></div><b>${rs(r.base)}</b></div>
      ${r.ded.map(d => `<div class="step"><div>− ${esc(d.category)}<div class="f">${esc(d.note)}</div></div><b style="color:var(--bad)">−${rs(d.amount)}</b></div>`).join('')}
      ${r.add.map(d => `<div class="step"><div>+ ${esc(d.category)}<div class="f">${esc(d.note)}</div></div><b style="color:var(--ok)">+${rs(d.amount)}</b></div>`).join('')}
      ${r.otPay ? `<div class="step"><div>+ Overtime<div class="f">${r.otH.toFixed(2)} h beyond ${r.workDays} days × ${e.duty} h, × ₹${r.rate.toFixed(2)} × ${D.config.otMultiplier || 1}</div></div><b style="color:var(--ok)">+${rs(r.otPay)}</b></div>` : ''}
      <div class="step total"><div><b>NET payable</b><div class="f">rounded to nearest ₹10${r.carry ? ' · ' + rs(r.carry) + ' carries forward to next month' : ''}${D.v9[e.id] ? ' · V9 had ' + rs(Number(D.v9[e.id].net)) : ''}</div></div><b style="font-size:18px">${rs(r.net)}</b></div></div>
    <h2 style="margin-top:18px">Shifts</h2><table><thead><tr><th>Date</th><th>IN</th><th>OUT</th><th>Store</th><th class="num">Hours</th></tr></thead><tbody>
    ${sh.map(s => `<tr><td>${s.date.slice(8)} ${D.monthLabel.slice(0, 3)}</td><td>${s.in}</td><td>${s.out}</td><td>${esc(branchName(s.store))}</td><td class="num">${s.hours.toFixed(2)}${s.hours <= D.config.halfDayHrs ? ' <span class="tag t-warn">½</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No shifts this month</td></tr>'}</tbody></table>`);
}
function csv(rows, name) {
  const t = rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + t], { type: 'text/csv' })); a.download = name; a.click();
}
function exportAttendance() {
  const D = ST.D, rows = [['Name', 'EMP ID', 'Date', 'Branch', 'IN', 'OUT', 'Total Hrs']];
  D.employees.forEach(e => D.byEmp[e.id].inMonth.forEach(s => {
    const h = Math.floor(s.hours), m = Math.round((s.hours - h) * 60);
    rows.push([e.name, e.id, s.date, branchName(s.store).toUpperCase(), s.in, s.out.replace(' +1', ''), `${h}:${String(m).padStart(2, '0')}`]);
  }));
  csv(rows, `BWC_Attendance_${D.month}.csv`);
}
function exportPayroll() {
  const D = ST.D, rows = [['WAFF ID', 'Name', 'Branch', 'Pay Type', 'Status', 'Plan', 'Duty Hrs', 'Days Worked', 'Clocked Hrs', 'Week-off Days', 'Base Salary', 'OT Hrs', 'OT Pay', 'Total Ded', 'Total Add', 'NET', 'NET Payable', 'Carry Fwd', 'V9 NET', 'Branches worked (share of base+OT)']];
  D.pay.forEach(({ e, r, branchSplit: bs }) => rows.push([e.id, e.name, branchName(e.branch), e.payType, e.status, e.plan, e.duty, r.days, r.workH.toFixed(2), r.creditDays, r.base.toFixed(2), r.otH.toFixed(2), r.otPay.toFixed(2), r.dedT, r.addT, r.net, r.payable, r.carry, D.v9[e.id] ? D.v9[e.id].net : '',
    bs ? bs.map(a => `${branchName(a.branch)} ${(a.frac * 100).toFixed(0)}%`).join(' / ') : '']));
  csv(rows, `BWC_Payroll_${D.month}.csv`);
}

/* ---------------- STORES (admin) ---------------- */
function stores() {
  const D = ST.D;
  $('#main').innerHTML = `<div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Stores &amp; geofence</h2><div class="sp"></div><button class="btn y" onclick="editStore(null)">+ Add store</button></div>
    <p class="muted">Managers capture each store once from the <b>manager app</b> (<a href="manager.html" target="_blank">heavencrescita.github.io/attendance/manager.html</a>): GPS ±30 m or better + live selfie with random gestures + outside and inside photos. A captured store is locked; unlock it here to let a manager redo it.</p>
    <div class="scroll"><table><thead><tr><th>Code</th><th>Store</th><th>Location</th><th class="num">Radius</th><th>Captured by</th><th>Photos</th><th>Shift planners</th><th>Active</th><th></th></tr></thead><tbody>
    ${D.stores.map(s => { const c = (D.captures || []).filter(x => x.store === s.code).pop();
      return `<tr><td>${s.code}</td><td><b>${esc(s.name)}</b></td><td>${s.lat === '' ? '<span class="tag t-bad">not set</span>' : `${s.lat}, ${s.lng}`}</td><td class="num">${s.radiusM} m</td>
      <td>${s.capturedBy ? `${esc(s.capturedBy)}<div class="muted">${String(s.capturedAt).slice(0, 16).replace('T', ' ')}${c ? ' · ±' + c.accuracyM + ' m' : ''}</div>${c ? `<span class="tag ${/^VERIFIED/.test(c.status) ? 't-ok' : 't-warn'}">${esc(c.status)}</span>` : ''}` : s.lat !== '' ? '<span class="tag t-warn">typed in by ' + esc(s.updatedBy) + '</span>' : '<span class="muted">—</span>'}</td>
      <td>${c ? `<button class="btn" onclick="capturePhotos('${s.code}')">View</button>` : '<span class="muted">—</span>'}</td>
      <td>${planners(s.code) || '<span class="tag t-bad">none</span>'} <a class="btn" onclick="goAssign()">Assign</a></td><td>${s.active}</td>
      <td><button class="btn" onclick="editStore('${s.code}')">Edit</button> ${s.locked === 'Yes' ? `<button class="btn r" onclick="unlockStore('${s.code}')">Unlock</button>` : ''} ${s.lat !== '' ? `<a class="btn" href="https://maps.google.com/?q=${s.lat},${s.lng}" target="_blank" rel="noopener">Map</a>` : ''}</td></tr>`; }).join('')}</tbody></table></div></div>`;
}
const planners = code => ST.D.employees.filter(e => e.roaming === 'Yes' && e.status === 'Active' && String(e.mgrStores || '').split(',').includes(code)).map(e => esc(e.name.split(' ')[0])).join(', ');
function goAssign() { go('shifts'); setTimeout(() => { const a = document.getElementById('assign'); if (a) a.scrollIntoView({ behavior: 'smooth' }); }, 50); }
function unlockStore(code) { if (confirmInline('Unlock this store so a manager can capture it again?')) act({ action: 'unlockStore', code }, 'Unlocked'); }
async function capturePhotos(code) {
  const D = ST.D, s = D.stores.find(x => x.code === code), c = (D.captures || []).filter(x => x.store === code).pop();
  openDrawer(`<div class="row"><h2 style="margin:0">${esc(s.name)} · capture</h2><div class="sp"></div><button class="btn" onclick="closeDrawer()">Close</button></div>
    <p class="muted">${esc(c.name)} (${c.empId}) · ${c.time.slice(0, 16).replace('T', ' ')} · ±${c.accuracyM} m · ${esc(c.status)}</p>
    ${[['selfieId', 'Live selfie (gesture frames)'], ['outsideId', 'Outside'], ['insideId', 'Inside']].map(([k, l]) => `<h2 style="margin-top:14px">${l}</h2><div id="cp_${k}" class="muted">Loading…</div>`).join('')}`);
  for (const k of ['selfieId', 'outsideId', 'insideId']) {
    try { $('#cp_' + k).innerHTML = `<img src="${await loadSelfie(c[k])}" style="width:100%;border-radius:12px">`; } catch (e) { $('#cp_' + k).textContent = e.message; }
  }
}
function editStore(code) {
  const s = code ? ST.D.stores.find(x => x.code === code) : { code: '', name: '', lat: '', lng: '', radiusM: 50, active: 'Yes' };
  openDrawer(`<div class="row"><h2 style="margin:0">${code ? esc(s.name) : 'Add store'}</h2><div class="sp"></div><button class="btn" onclick="closeDrawer()">Close</button></div>
    <div class="form" style="margin-top:14px">
      <label>Code<input type="text" id="s_code" value="${s.code}" ${code ? 'disabled' : ''} maxlength="4"></label>
      <label>Name<input type="text" id="s_name" value="${esc(s.name)}"></label>
      <label>Latitude<input type="text" id="s_lat" value="${s.lat}" inputmode="decimal"></label>
      <label>Longitude<input type="text" id="s_lng" value="${s.lng}" inputmode="decimal"></label>
      <label>Geofence radius (m)<input type="number" id="s_rad" value="${s.radiusM}"></label>
      <label>Active<select id="s_act"><option ${s.active !== 'No' ? 'selected' : ''}>Yes</option><option ${s.active === 'No' ? 'selected' : ''}>No</option></select></label></div>
    <button class="btn t" style="margin-top:12px" onclick="hereLoc()">Use my current location</button> <span class="muted" id="s_gps"></span>
    <p class="muted">Or paste from Google Maps: long-press the store → copy the "13.05, 80.24" numbers.</p>
    <button class="btn y" onclick="saveStore()">Save</button>`);
}
function hereLoc() {
  if (!navigator.geolocation) return toast('Location not available', true);
  $('#s_gps').textContent = 'Reading GPS…'; let best = null;
  const w = navigator.geolocation.watchPosition(p => {
    if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
    $('#s_lat').value = best.coords.latitude.toFixed(6); $('#s_lng').value = best.coords.longitude.toFixed(6);
    $('#s_gps').textContent = '±' + Math.round(best.coords.accuracy) + ' m ' + (best.coords.accuracy <= 20 ? '✓ good' : '(wait for ±20 m)');
  }, e => { $('#s_gps').textContent = e.message; }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  setTimeout(() => navigator.geolocation.clearWatch(w), 30000);
}
async function saveStore() {
  await act({ action: 'saveStore', store: { code: $('#s_code').value, name: $('#s_name').value, lat: $('#s_lat').value.trim(), lng: $('#s_lng').value.trim(), radiusM: $('#s_rad').value, active: $('#s_act').value } }, 'Store saved');
  closeDrawer();
}

/* ---------------- USERS (admin) ---------------- */
/* ---------------- STAFF REQUESTS (from My BWC) ---------------- */
const REQ_F = { phone: 'Mobile', altPhone: 'Other mobile', email: 'Email', address: 'Address', emergencyName: 'Emergency contact', emergencyPhone: 'Emergency number', bankAcct: 'Bank account', ifsc: 'IFSC', acctName: 'Name on account' };
function reqs() {
  const D = ST.D, R = (D.requests || []).slice().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  const pend = R.filter(r => r.status === 'PENDING'), done = R.filter(r => r.status !== 'PENDING');
  const body = r => { let d = {}; try { d = JSON.parse(r.data); } catch (x) {} const e = D.emp[r.empId] || {};
    if (r.kind === 'CORRECTION') return `<b>Missing or wrong punch</b> · ${esc(d.date)} · ${esc(d.inT)}–${esc(d.outT)}<div class="muted">“${esc(d.reason)}”</div>`;
    if (r.kind === 'MISSED_PUNCHOUT') return `<b>Missed punch-out</b> · ${esc(d.date)} · clocked in ${esc(String(d.inTime).slice(11, 16))}, says they left ${esc(d.outT)}<div class="muted">“${esc(d.reason)}”</div>`;
    if (r.kind === 'PETTY_CASH') return `<b>Petty cash · ₹${esc(d.amount)} · ${esc(d.category)}</b> · ${esc(branchName(d.store))} · ${esc(d.date)}<div class="muted">“${esc(d.note)}”</div>
      <div class="row" style="margin-top:6px">${(d.photoIds || []).map((id, i) => `<button class="btn" style="padding:3px 9px" onclick="viewSelfie('${id}','${esc(r.name)} — invoice ${i + 1}')">Invoice ${i + 1}</button>`).join('')}</div>`;
    return `<b>Update details</b><table style="margin-top:6px"><tbody>${Object.keys(d).map(k => `<tr><td class="muted">${REQ_F[k] || k}</td><td>${esc(e[k] || '—')}</td><td>→</td><td><b>${esc(d[k])}</b></td></tr>`).join('')}</tbody></table>`; };
  $('#main').innerHTML = `<div class="card"><h2>Waiting for you · ${pend.length}</h2>
    <p class="muted" style="margin-top:-6px">Staff send these from My BWC (heavencrescita.github.io/attendance/me.html). Approving a punch correction adds a manual IN and OUT; approving details updates the employee record. Missed punch-outs and petty cash expenses can only be approved by Sarah (HR admin).</p>
    ${pend.map(r => { const locked = (r.kind === 'MISSED_PUNCHOUT' || r.kind === 'PETTY_CASH') && D.role !== 'hr'; return `<div class="card" style="margin-top:10px"><div class="row"><div><b>${esc(r.name)}</b> <span class="muted">${r.empId} · ${String(r.createdAt).slice(0, 16).replace('T', ' ')}</span>${r.test ? ' <span class="tag t-mute">test account</span>' : ''}${(r.kind === 'MISSED_PUNCHOUT' || r.kind === 'PETTY_CASH') ? ' <span class="tag t-warn">needs Sarah</span>' : ''}</div></div>
      <div style="margin:8px 0">${body(r)}</div>
      ${locked ? `<p class="muted">Only Sarah (HR admin) can review this one.</p>` : `<div class="row"><input type="text" id="rn-${r.requestId}" placeholder="Note to the employee (optional)" style="flex:1"><button class="btn g" onclick="decide('${r.requestId}','APPROVE')">Approve</button><button class="btn r" onclick="decide('${r.requestId}','REJECT')">Reject</button></div>`}</div>`; }).join('') || '<p class="muted">Nothing to review.</p>'}</div>
  ${done.length ? `<div class="card" style="margin-top:14px"><h2>Recently decided</h2><div class="scroll"><table><thead><tr><th>When</th><th>Employee</th><th>Request</th><th>Decision</th><th>By</th></tr></thead><tbody>
    ${done.map(r => `<tr><td>${String(r.decidedAt).slice(0, 10)}</td><td>${esc(r.name)} <span class="muted">${r.empId}</span></td><td style="white-space:normal">${body(r)}</td><td>${r.status === 'APPROVED' ? '<span class="tag t-ok">Approved</span>' : '<span class="tag t-bad">Rejected</span>'} <span class="muted">${esc(r.decisionNote)}</span></td><td>${esc(r.decidedBy)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
  ${(D.role === 'admin' || D.role === 'hr') ? `<div class="card" style="margin-top:14px"><h2>Test account</h2>
    <p class="muted" style="margin-top:-6px">WAFF-901 “Test Employee” works in My BWC and on the punch screen like a real employee, but WAFF-900 to WAFF-999 never count in payroll, the dashboard, exports or the shift planner. Resetting wipes its punches, shifts and requests and loads fresh sample data for this month.</p>
    <button class="btn" onclick="resetTest()">Reset test account</button> <span id="testOut" class="muted"></span></div>` : ''}`;
}
async function resetTest() { const r = await act({ action: 'testAccount' }, 'Test account ready'); $('#testOut').textContent = `Sign in at me.html with ${r.id} · PIN ${r.pin} · ${r.punches} punches, ${r.shifts} shifts loaded`; }
async function decide(id, decision) { await act({ action: 'reviewRequest', requestId: id, decision, note: ($('#rn-' + id) || {}).value || '' }, decision === 'APPROVE' ? 'Approved' : 'Rejected'); }

function users() {
  const D = ST.D;
  $('#main').innerHTML = `<div class="card"><h2>Dashboard users</h2>
    <p class="muted"><b>hr</b> (Sarah): everything admin can do, plus the only role that can add new employees, issue/reset PINs, or approve a missed punch-out. <b>admin</b>: everything except those three. <b>staff</b> (backend team): employees (edits), review, manual punches, deductions/additions, payroll — not stores, users, or the hr-only actions.</p>
    <table><thead><tr><th>User</th><th>Role</th><th>Active</th></tr></thead><tbody>${D.users.map(u => `<tr><td><b>${esc(u.user)}</b></td><td>${u.role}</td><td>${u.active}</td></tr>`).join('')}</tbody></table>
    <h2 style="margin-top:18px">Add or update a user</h2>
    <div class="form"><label>User name<input type="text" id="u_user" placeholder="e.g. sarah"></label>
      <label>Role<select id="u_role"><option>staff</option><option>admin</option><option>hr</option></select></label>
      <label>Active<select id="u_act"><option>Yes</option><option>No</option></select></label>
      <label>Password (8+ chars; blank = keep)<input type="password" id="u_pw" autocomplete="new-password"></label>
      <button class="btn y" onclick="saveUser()">Save user</button></div></div>`;
}
function saveUser() { act({ action: 'saveUser', user: $('#u_user').value, role: $('#u_role').value, active: $('#u_act').value, password: $('#u_pw').value }, 'User saved'); }
function pwDialog() {
  openDrawer(`<div class="row"><h2 style="margin:0">Change my password</h2><div class="sp"></div><button class="btn" onclick="closeDrawer()">Close</button></div>
    <div class="form" style="margin-top:14px"><label>Current password<input type="password" id="pw_old"></label><label>New password (8+)<input type="password" id="pw_new"></label></div>
    <button class="btn y" style="margin-top:12px" onclick="chPw()">Change password</button>`);
}
async function chPw() { try { await api({ action: 'changePassword', oldPassword: $('#pw_old').value, newPassword: $('#pw_new').value }); toast('Password changed'); closeDrawer(); } catch (e) { toast(e.message, true); } }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
if (ST.token) load().catch(e => renderLogin(e.message)); else renderLogin('');
</script>
