<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BWC Attendance Admin</title>
<style>
:root{--yellow:#fff200;--black:#0d0d0d;--teal:#27bdbe;--bg:#f5f5f0;--card:#fff;--ink:#151515;--muted:#6b6b66;--line:#e4e4dc;--chip:#f0f0ea;
--ok:#1a7f37;--ok-bg:#e6f4ea;--warn:#9a5b00;--warn-bg:#fff4dc;--bad:#b4232b;--bad-bg:#fde8e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1c1c1b;--ink:#f2f2ee;--muted:#a3a39b;--line:#2e2e2b;--chip:#262624;--ok-bg:#16301f;--warn-bg:#33270f;--bad-bg:#3a1a1c;--ok:#5fd17f;--warn:#f0b445;--bad:#ff7a80}}
:root[data-theme="dark"]{--bg:#121212;--card:#1c1c1b;--ink:#f2f2ee;--muted:#a3a39b;--line:#2e2e2b;--chip:#262624;--ok-bg:#16301f;--warn-bg:#33270f;--bad-bg:#3a1a1c;--ok:#5fd17f;--warn:#f0b445;--bad:#ff7a80}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
button,input,select{font:inherit;color:inherit}
.top{background:var(--black);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:50%;background:var(--yellow);border:3px solid var(--teal);display:grid;place-items:center;font-weight:800;color:#000;font-size:11px;flex:none}
.top h1{font-size:16px;margin:0;color:var(--yellow)} .top .sub{font-size:12px;color:#bdbdb5}
.top .sp{flex:1}
.top input[type=month]{background:#262626;border:1px solid #3a3a3a;border-radius:8px;padding:5px 8px;color:#fff}
.pill{font-size:12px;padding:5px 10px;border-radius:999px;background:#262626;color:#e8e8e2;border:0;cursor:pointer}
.pill b{color:var(--yellow)}
nav{display:flex;gap:2px;padding:0 20px;background:var(--black);overflow-x:auto;border-top:1px solid #222}
nav button{background:none;border:0;color:#cfcfc8;padding:11px 13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav button.on{color:#fff;border-bottom-color:var(--yellow)}
nav .n{background:var(--yellow);color:#000;border-radius:999px;padding:0 6px;font-size:11px;margin-left:6px;font-weight:700}
main{max-width:1280px;margin:0 auto;padding:20px}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.two{grid-template-columns:1.4fr 1fr}@media(max-width:900px){.two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}.kpi .v{font-size:26px;font-weight:800;margin-top:4px}.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.kpi.accent{border-left:5px solid var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}.chip input{width:auto;margin:0}
h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card);z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--chip)} tr.click{cursor:pointer}
.scroll{overflow:auto;max-height:68vh}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-mute{background:var(--chip);color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],input[type=date],select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
input.mini{width:58px;text-align:right;padding:3px 6px}
.btn{border:0;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--chip);white-space:nowrap}
.btn.y{background:var(--yellow);color:#000}.btn.t{background:var(--teal);color:#fff}.btn.r{background:var(--bad-bg);color:var(--bad)}.btn.g{background:var(--ok-bg);color:var(--ok)}
.btn:disabled{opacity:.5}
.muted{color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;line-height:1.45}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50}.drawer.on{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(540px,100%);background:var(--card);padding:20px;overflow:auto}
.steps{display:grid;gap:8px;margin-top:10px}
.step{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.step .f{font-size:12px;color:var(--muted);margin-top:2px}.step.total{border:2px solid var(--teal)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.form label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.flag{display:grid;grid-template-columns:150px 1fr;gap:14px}
.selfie{width:150px;height:140px;border-radius:10px;background:var(--chip);display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;overflow:hidden;cursor:pointer}
.selfie img{width:100%;height:100%;object-fit:cover}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
#login{max-width:380px;margin:60px auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90vw}
.loading{opacity:.5;pointer-events:none}
.pins td{font-size:15px}
@media print{.top,nav,.noprint{display:none!important}main{padding:0}.card{border:0}}
@media(max-width:640px){main{padding:14px}.top{padding:10px 14px}nav{padding:0 6px}.kpi .v{font-size:22px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()"><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzZzIRS-eO9MykhaJ9MEnDy32U5HEWOyf_WioqUlzUulfICsZ1Gm6ohePmuBmDYdAKx/exec';
// BWC payroll engine — mirrors the formulas in BWC_Payroll_Sep2026_FINAL_v3.xlsx (SEP-26 PAYROLL sheet).
//  Days worked : shift > halfDayHrs (4 h) = 1 day, 0 < shift ≤ 4 h = ½ day
//  Week-off    : W/O eligible → credit days = min(WkOff, days ≥ workDays ? WkOff : INT((days+1)/7)); hours = days × duty
//  Rate / hr   : eligible → plan ÷ (calDays × duty); not eligible → dailyRate ÷ duty
//  FIXED       : base = plan ÷ workDays × min(days, workDays); no OT
//  HOURLY      : hours = clocked + credit; OT hrs = max(0, clocked − workDays × duty); base = rate × (hours − OT); OT pay = OT × rate × otMultiplier
//  NET         : Inactive → 0, else ROUND((base + OT + additions − deductions) ÷ 10) × 10 (Excel rounding); negative NET carries forward
const COUNTED = ['ACCEPTED', 'APPROVED', 'MANUAL'];
const MAX_SHIFT_MS = 24 * 3600000;   // must match OPEN_SHIFT_MAX_H in Code.gs
const LONG_SHIFT_H = 20;

function istParts(iso) { return { date: iso.slice(0, 10), time: iso.slice(11, 16) }; }

// Pair punches into shifts for one employee. Returns {shifts, issues}.
function buildShifts(punches, now) {
  now = now || Date.now();
  const ps = punches.filter(p => COUNTED.includes(p.status)).sort((a, b) => Number(a.epoch) - Number(b.epoch));
  const shifts = [], issues = []; let open = null;
  for (const p of ps) {
    if (p.type === 'IN') {
      if (open) issues.push({ kind: 'Missing OUT', punch: open });
      open = p;
    } else {
      if (open && Number(p.epoch) - Number(open.epoch) <= MAX_SHIFT_MS) {
        const i = istParts(open.time), o = istParts(p.time);
        shifts.push({ date: i.date, day: Number(i.date.slice(8, 10)), in: i.time, out: o.time + (o.date !== i.date ? ' +1' : ''),
          hours: (Number(p.epoch) - Number(open.epoch)) / 3600000, store: open.store, inPunch: open, outPunch: p });
        if ((Number(p.epoch) - Number(open.epoch)) / 3600000 > LONG_SHIFT_H) issues.push({ kind: 'Very long shift — check', punch: open, counted: true });
        open = null;
      } else issues.push({ kind: 'OUT without IN', punch: p });
    }
  }
  if (open) issues.push({ kind: now - Number(open.epoch) > MAX_SHIFT_MS ? 'Missing OUT' : 'On shift now', punch: open });
  return { shifts, issues };
}

// Imported (Excel) shifts → same shape as punched shifts
function importedShifts(rows) {
  return rows.map(r => ({ date: r.date, day: Number(String(r.date).slice(8, 10)), in: r.inT, out: r.outT, hours: Number(r.hours), store: r.branch, imported: true }));
}

function daysInMonth(month) { const [y, m] = month.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function excelRound(x) { return Math.sign(x) * Math.round(Math.abs(x) + 1e-9); }

// e: employee row; shifts: that employee's shifts dated inside the month; ctx: {month, cfg, ded, add, weekOff}
function calcPay(e, shifts, ctx) {
  const cfg = ctx.cfg, calDays = daysInMonth(ctx.month), workDays = calDays - Number(cfg.weekOffsPerMonth || 4);
  const halfH = Number(cfg.halfDayHrs || 4), otMult = Number(cfg.otMultiplier || 1);
  const duty = Number(e.duty) || 9, plan = Number(e.plan) || 0;
  const worked = shifts.filter(x => x.hours > 0);
  const clockH = worked.reduce((s, x) => s + x.hours, 0);
  const halfDays = worked.filter(x => x.hours <= halfH).length;
  const days = worked.length - 0.5 * halfDays;
  const eligible = e.woEligible !== 'No';
  const woMax = e.woDays === '' || e.woDays == null ? Number(cfg.weekOffsPerMonth || 4) : Number(e.woDays);
  const rate = eligible ? plan / (calDays * duty) : (Number(e.dailyRate) || plan / calDays) / duty;
  const wo = (ctx.weekOff || []).find(w => w.empId === e.id);
  const ruleCredit = eligible ? Math.min(woMax, days >= workDays ? woMax : Math.floor((days + 1) / 7)) : 0;
  const creditDays = wo ? Number(wo.days) : ruleCredit;
  const creditSource = wo ? 'set by ' + wo.setBy : (eligible ? 'rule' : 'not eligible');
  const creditH = creditDays * duty;
  const active = e.status === 'Active';
  let base = 0, otH = 0, otPay = 0, basis;
  if (e.payType === 'FIXED') {
    base = active ? plan / workDays * Math.min(days, workDays) : 0;
    basis = `₹${inr(plan)} ÷ ${workDays} × min(${days}, ${workDays})`;
  } else {
    const hrs = clockH + creditH, expH = workDays * duty;
    otH = Math.max(0, clockH - expH);
    base = active ? rate * (hrs - otH) : 0;
    otPay = active ? otH * rate * otMult : 0;
    basis = `(${clockH.toFixed(2)} h + ${creditH} h week-off − ${otH.toFixed(2)} h OT) × ₹${rate.toFixed(2)}/h`;
  }
  const ded = (ctx.ded || []).filter(x => x.empId === e.id), add = (ctx.add || []).filter(x => x.empId === e.id);
  const dedT = ded.reduce((s, x) => s + Number(x.amount), 0), addT = add.reduce((s, x) => s + Number(x.amount), 0);
  const gross = base + otPay + addT - dedT;
  const net = active ? excelRound(gross / 10) * 10 : 0;
  return { workH: clockH, days, halfDays, calDays, workDays, rate, creditDays, creditSource, creditH, eligible, base, otH, otPay, basis,
    ded, add, dedT, addT, gross, net, payable: Math.max(0, net), carry: Math.max(0, -net) };
}
function inr(n) { return Math.round(n).toLocaleString('en-IN'); }


const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = n => (n < 0 ? '−₹' : '₹') + Math.abs(Math.round(n)).toLocaleString('en-IN');
const store = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } };
const CATS_D = ['COMPLAINT', 'UNI/HYG/TRNG', 'DISCIPLINE', 'ADVANCE', 'T-SHIRT/EQUIP', 'CASH SHORT', 'OTHER'];
const CATS_A = ['BONUS', 'INCENTIVE', 'Accident Coverage', 'ARREARS', 'OTHER'];
const nowMonth = () => new Date(Date.now() + 5.5 * 3600000).toISOString().slice(0, 7);
let ST = { token: store('bwc_tok'), month: store('bwc_month') || nowMonth(), tab: 'overview', day: null, branch: 'ALL', D: null, selfies: {} };

async function api(body, quiet) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ token: ST.token }, body)) });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') { ST.token = null; store('bwc_tok', null); renderLogin('Session expired — sign in again'); throw new Error('Session expired'); }
    throw new Error(j.error || 'Request failed');
  }
  return j;
}
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.style.background = bad ? 'var(--bad)' : 'var(--black)'; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }
async function act(body, okMsg) { try { const r = await api(body); if (okMsg) toast(okMsg); await load(); return r; } catch (e) { toast(e.message, true); throw e; } }

/* ---------------- LOGIN ---------------- */
function renderLogin(msg) {
  $('#app').innerHTML = `<div id="login" class="card">
    <div class="row" style="margin-bottom:14px"><div class="logo">BWC</div><div><b>The Belgian Waffle Cafe</b><div class="muted">Attendance &amp; payroll admin</div></div></div>
    <label class="muted">User name<input type="text" id="lu" autocomplete="username"></label><br>
    <label class="muted">Password<input type="password" id="lp" autocomplete="current-password"></label>
    <button class="btn y" style="width:100%;margin-top:14px;padding:11px" id="lb" onclick="doLogin()">Sign in</button>
    <p class="muted" id="lm" style="min-height:18px">${esc(msg || '')}</p></div>`;
  $('#lp').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}
async function doLogin() {
  $('#lb').disabled = true; $('#lm').textContent = 'Signing in…';
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'login', user: $('#lu').value, password: $('#lp').value }) }).then(r => r.json());
    if (!r.ok) throw new Error(r.error);
    ST.token = r.token; store('bwc_tok', r.token); await load();
  } catch (e) { $('#lm').textContent = e.message; $('#lb').disabled = false; }
}
function logout() { api({ action: 'logout' }).catch(() => {}); ST.token = null; store('bwc_tok', null); renderLogin('Signed out'); }

/* ---------------- DATA ---------------- */
async function load() {
  document.body.classList.add('loading');
  try {
    const D = await api({ action: 'bootstrap', month: ST.month });
    ST.D = D; derive(); render();
  } finally { document.body.classList.remove('loading'); }
}
function derive() {
  const D = ST.D;
  D.emp = Object.fromEntries(D.employees.map(e => [e.id, e]));
  D.storeName = Object.fromEntries(D.stores.map(s => [s.code, s.name])); D.storeName.MGR = 'Managers (roaming)';
  D.byEmp = {}; D.issues = [];
  D.employees.forEach(e => {
    const b = buildShifts(D.punches.filter(p => p.empId === e.id));
    b.inMonth = b.shifts.filter(s => s.date.slice(0, 7) === D.month)
      .concat(importedShifts((D.importedShifts || []).filter(r => r.empId === e.id))).sort((x, y) => (x.date + x.in).localeCompare(y.date + y.in));
    D.byEmp[e.id] = b;
    b.issues.forEach(i => D.issues.push(Object.assign({ emp: e }, i)));
  });
  D.flagged = D.punches.filter(p => p.status === 'FLAGGED').sort((a, b) => Number(b.epoch) - Number(a.epoch));
  D.pay = D.employees.map(e => ({ e, r: calcPay(e, D.byEmp[e.id].inMonth, { month: D.month, cfg: D.config, ded: D.deductions, add: D.additions, weekOff: D.weekOff }) }));
  D.v9 = Object.fromEntries((D.v9Ref || []).map(v => [v.empId, v]));
  D.hasV9 = (D.v9Ref || []).length > 0;
  D.unmatched = (D.importedShifts || []).filter(r => !r.empId);
  D.pay.forEach(x => { const v = D.v9[x.e.id]; x.v9 = v ? Number(v.net) : null; });
  D.notInV9 = D.hasV9 ? D.pay.filter(x => x.v9 === null && x.r.net !== 0) : [];
  D.v9Match = D.pay.filter(x => x.v9 !== null && x.v9 === x.r.net).length;
  derivePlan();
  const today = new Date(Date.now() + 5.5 * 3600000).toISOString().slice(0, 10);
  if (!ST.day || ST.day.slice(0, 7) !== D.month) ST.day = today.slice(0, 7) === D.month ? today : D.month + '-01';
}
const branchName = c => (ST.D.storeName[c] || c);
const LATE_GRACE_MIN = 10;
// Planned vs actual (report only — pay is still calculated from punches)
function derivePlan() {
  const D = ST.D, now = Date.now();
  const plan = (D.shifts || []).filter(s => s.status !== 'CANCELLED');
  const ins = D.punches.filter(p => p.type === 'IN' && p.status !== 'REJECTED');
  const used = new Set();
  const rows = plan.map(s => {
    const st = Date.parse(s.date + 'T' + s.start + ':00+05:30'), dur = Number(s.hours) * 3600000, en = st + dur;
    const cand = ins.filter(p => p.empId === s.empId && !used.has(p.punchId) && Number(p.epoch) > st - 4 * 3600000 && Number(p.epoch) < st + 8 * 3600000)
      .sort((a, b) => Math.abs(a.epoch - st) - Math.abs(b.epoch - st))[0];
    let res, late = 0, out = '';
    if (cand) {
      used.add(cand.punchId); late = Math.round((Number(cand.epoch) - st) / 60000);
      res = late > LATE_GRACE_MIN ? 'Late' : 'On time';
      const sh = (D.byEmp[s.empId] || { shifts: [] }).shifts.find(x => x.inPunch && x.inPunch.punchId === cand.punchId); out = sh ? sh.out : '';
    } else res = st > now ? 'Upcoming' : en > now ? 'Not in yet' : 'No-show';
    return { s, st, inPunch: cand, late, out, res };
  }).sort((a, b) => a.st - b.st);
  const planned = new Set(plan.map(s => s.empId + '|' + s.date));
  const planStores = new Set(plan.map(s => s.store));
  const unplanned = ins.filter(p => !used.has(p.punchId) && planStores.has(p.store) && !planned.has(p.empId + '|' + String(p.time).slice(0, 10)) && String(p.time).slice(0, 7) === D.month);
  D.plan = { rows, unplanned };
}

/* ---------------- SHELL ---------------- */
function render() {
  const D = ST.D, isAdmin = D.role === 'admin';
  const tabs = [['overview', 'Overview'], ['daily', 'Daily attendance'], ['flags', 'Review', D.flagged.length + D.issues.filter(i => i.kind !== 'On shift now').length],
    ['shifts', 'Shift plan', (D.plan.rows || []).filter(r => r.s.status === 'REJECTED' && r.res !== 'Past').length], ['emps', 'Employees'], ['regs', 'Deductions & additions'], ['pay', 'Payroll']];
  if (isAdmin) tabs.push(['stores', 'Stores'], ['users', 'Users']);
  $('#app').innerHTML = `
  <div class="top"><div class="logo">BWC</div><div><h1>The Belgian Waffle Cafe</h1><div class="sub">Attendance &amp; payroll admin</div></div><div class="sp"></div>
    <input type="month" value="${D.month}" onchange="ST.month=this.value;store('bwc_month',this.value);load()" title="Payroll month">
    <button class="pill" onclick="pwDialog()"><b>${esc(D.user)}</b> · ${D.role}</button><button class="pill" onclick="logout()">Sign out</button></div>
  <nav>${tabs.map(([k, l, n]) => `<button class="${ST.tab === k ? 'on' : ''}" onclick="go('${k}')">${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</nav>
  <main id="main"></main>`;
  ({ overview, daily, flags, shifts: shiftPlan, emps, regs, pay, stores, users })[ST.tab]();
}
function go(t) { ST.tab = t; render(); window.scrollTo(0, 0); }
function closeDrawer() { $('#drawer').classList.remove('on'); }
function openDrawer(html) { $('#panel').innerHTML = html; $('#drawer').classList.add('on'); }
const branchSelect = (v, on) => `<select onchange="${on}"><option value="ALL">All branches</option>${branchCodes().map(c => `<option value="${c}" ${c === v ? 'selected' : ''}>${esc(branchName(c))}</option>`).join('')}</select>`;
function branchCodes() { return [...new Set(ST.D.employees.map(e => e.branch))].sort((a, b) => branchName(a).localeCompare(branchName(b))); }

/* ---------------- SHIFT PLAN ---------------- */
function shiftPlan() {
  const D = ST.D, b = ST.planStore || 'ALL', f = ST.planFilter || 'ALL';
  const inStore = r => b === 'ALL' || r.s.store === b;
  const rows = D.plan.rows.filter(inStore);
  const cnt = k => rows.filter(k).length;
  const ack = { PENDING: ['Waiting', 't-warn'], ACCEPTED: ['Accepted', 't-ok'], REJECTED: ['Rejected', 't-bad'] };
  const resTag = r => r.res === 'Late' ? `<span class="tag t-bad">Late ${r.late} min</span>` : r.res === 'No-show' ? '<span class="tag t-bad">No-show</span>' : r.res === 'On time' ? '<span class="tag t-ok">On time</span>' : `<span class="tag t-mute">${r.res}</span>`;

      <div class="card kpi"><div class="l">Late arrivals</div><div class="v">${cnt(r => r.res === 'Late')}</div></div>

    <div class="row" style="gap:6px;margin:14px 0 8px">${[['ALL', 'All'], ['REJECTED', 'Rejected'], ['PENDING', 'Waiting'], ['LATE', 'Late'], ['NOSHOW', 'No-show']].map(([k, l]) => `<button class="btn ${f === k ? 'y' : ''}" onclick="ST.planFilter='${k}';render()">${l}</button>`).join('')}</div>

  ${D.unmatched.length ? `<div class="note"><b>${D.unmatched.length} attendance rows have no WAFF ID</b> and are not paid by V9 or here: ${[...new Set(D.unmatched.map(u => u.name))].map(esc).join(', ')}. Add these people to the master or fix the IDs.</div>` : ''}

      <tbody>${byB.map(x => `<tr class="click" onclick="ST.branch='${x.b}';go('pay')"><td><b>${esc(branchName(x.b))}</b></td><td class="num">${x.act}</td><td class="num">${x.on}</td><td class="num">${Math.round(x.hrs)}</td><td class="num">${rs(x.cost)}</td><td><div class="bar"><i style="width:${(x.cost / maxC * 100).toFixed(1)}%"></i></div></td></tr>`).join('')}</tbody></table></div></div>

async function saveEmp(isNew) {

    payType: $('#f_type').value, plan: $('#f_plan').value, duty: $('#f_duty').value, woEligible: $('#f_wo').value, woDays: $('#f_wod').value, dailyRate: $('#f_dr').value, status: $('#f_status').value,

async function resetPin(id) {
  const e = ST.D.emp[id];
  if (e.hasPin && !confirmInline(`Reset PIN for ${e.name}? Their old PIN stops working.`)) return;
  const r = await act({ action: 'resetPin', id }, '');
  pinSheet([{ id: r.id, name: r.name, branch: e.branch, pin: r.pin }], 'New PIN');
}
function confirmInline(msg) { return window.confirm(msg); }
async function bulkPins() {
  const r = await act({ action: 'bulkPins' }, '');
  if (!r.pins.length) return toast('Everyone active already has a PIN');
  pinSheet(r.pins, r.pins.length + ' new PINs');
}
function pinSheet(list, title) {
  openDrawer(`<div class="row noprint"><h2 style="margin:0">${title}</h2><div class="sp"></div><button class="btn t" onclick="window.print()">Print</button><button class="btn" onclick="closeDrawer()">Close</button></div>

    .sort((a, b) => String(b.addedAt).localeCompare(String(a.addedAt)));

    <div class="form">

      <label>Employee<select id="r_emp">${D.employees.filter(e => e.status === 'Active').map(e => `<option value="${e.id}">${e.id} · ${esc(e.name)}</option>`).join('')}</select></label>
      <label>Category<select id="r_cat">${CATS_D.map(c => `<option>${c}</option>`).join('')}</select></label>

  <div class="card" style="margin-top:14px"><h2>${esc(D.monthLabel)} · ${all.length} entries · deductions ${rs(D.deductions.reduce((s, x) => s + Number(x.amount), 0))} · additions ${rs(D.additions.reduce((s, x) => s + Number(x.amount), 0))}</h2>
    <div class="scroll"><table><thead><tr><th>Type</th><th>WAFF ID</th><th>Name</th><th>Category</th><th class="num">Amount</th><th>Note</th><th>Added by</th><th></th></tr></thead><tbody>
    ${all.map(x => `<tr><td>${x.kind === 'deduction' ? '<span class="tag t-bad">Deduction</span>' : '<span class="tag t-ok">Addition</span>'}</td><td>${x.empId}</td><td>${esc((D.emp[x.empId] || {}).name)}</td><td>${esc(x.category)}</td><td class="num">${rs(x.amount)}</td><td class="muted">${esc(x.note)}</td><td class="muted">${esc(x.addedBy)} · ${String(x.addedAt).slice(0, 10)}</td><td><button class="btn" onclick="delReg('${x.kind}','${x.rowId}')">Remove</button></td></tr>`).join('') || '<tr><td colspan="8" class="muted">No entries for this month.</td></tr>'}
    </tbody></table></div></div>`;
}
function addReg() {
  const amt = Number($('#r_amt').value); if (!(amt > 0)) return toast('Enter an amount', true);

function delReg(kind, rowId) { if (confirmInline('Remove this entry?')) act({ action: 'delReg', kind, rowId }, 'Removed'); }

  ${missing || D.flagged.length ? `<div class="note">${D.flagged.length} flagged punch(es) and ${missing} missing OUT(s) are <b>not</b> in these numbers yet. <a href="#" onclick="go('flags');return false">Review →</a></div>` : ''}

    ${R.map(({ e, r }) => `<tr class="click" onclick="if(event.target.tagName!=='INPUT')showCalc('${e.id}')"><td>${e.id}</td><td><b>${esc(e.name)}</b></td><td>${esc(branchName(e.branch))}</td><td>${e.payType}</td>

      <td class="num">${r.eligible ? `<input class="mini" type="number" min="0" max="8" value="${r.creditDays}" onchange="setWO('${e.id}',this.value)" title="${r.creditSource}"> ${r.creditSource === 'rule' ? '' : '<span class="tag t-mute">manual</span>'}` : '<span class="muted">—</span>'}</td>

function x9(id, net) {
  const v = ST.D.v9[id];

  const n = Number(v.net);
  return n === net ? `<span class="tag t-ok">${rs(n)} ✓</span>` : `<span class="tag t-warn">${rs(n)}</span>`;
}
function setWO(id, v) { act({ action: 'setWeekOff', empId: id, month: ST.D.month, days: Number(v) }, 'Week-off days saved'); }

      ${r.add.map(d => `<div class="step"><div>+ ${esc(d.category)}<div class="f">${esc(d.note)}</div></div><b style="color:var(--ok)">+${rs(d.amount)}</b></div>`).join('')}

      <div class="step total"><div><b>NET payable</b><div class="f">rounded to nearest ₹10${r.carry ? ' · ' + rs(r.carry) + ' carries forward to next month' : ''}${D.v9[e.id] ? ' · V9 had ' + rs(Number(D.v9[e.id].net)) : ''}</div></div><b style="font-size:18px">${rs(r.net)}</b></div></div>
    <h2 style="margin-top:18px">Shifts</h2><table><thead><tr><th>Date</th><th>IN</th><th>OUT</th><th>Store</th><th class="num">Hours</th></tr></thead><tbody>
    ${sh.map(s => `<tr><td>${s.date.slice(8)} ${D.monthLabel.slice(0, 3)}</td><td>${s.in}</td><td>${s.out}</td><td>${esc(branchName(s.store))}</td><td class="num">${s.hours.toFixed(2)}${s.hours <= D.config.halfDayHrs ? ' <span class="tag t-warn">½</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No shifts this month</td></tr>'}</tbody></table>`);

function csv(rows, name) {
  const t = rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + t], { type: 'text/csv' })); a.download = name; a.click();
}
function exportAttendance() {
  const D = ST.D, rows = [['Name', 'EMP ID', 'Date', 'Branch', 'IN', 'OUT', 'Total Hrs']];
  D.employees.forEach(e => D.byEmp[e.id].inMonth.forEach(s => {
    const h = Math.floor(s.hours), m = Math.round((s.hours - h) * 60);
    rows.push([e.name, e.id, s.date, branchName(s.store).toUpperCase(), s.in, s.out.replace(' +1', ''), `${h}:${String(m).padStart(2, '0')}`]);
  }));
  csv(rows, `BWC_Attendance_${D.month}.csv`);
}
function exportPayroll() {
  const D = ST.D, rows = [['WAFF ID', 'Name', 'Branch', 'Pay Type', 'Status', 'Plan', 'Duty Hrs', 'Days Worked', 'Clocked Hrs', 'Week-off Days', 'Base Salary', 'OT Hrs', 'OT Pay', 'Total Ded', 'Total Add', 'NET', 'NET Payable', 'Carry Fwd', 'V9 NET']];
  D.pay.forEach(({ e, r }) => rows.push([e.id, e.name, branchName(e.branch), e.payType, e.status, e.plan, e.duty, r.days, r.workH.toFixed(2), r.creditDays, r.base.toFixed(2), r.otH.toFixed(2), r.otPay.toFixed(2), r.dedT, r.addT, r.net, r.payable, r.carry, D.v9[e.id] ? D.v9[e.id].net : '']));
  csv(rows, `BWC_Payroll_${D.month}.csv`);
}

    <button class="btn y" onclick="saveStore()">Save</button>`);
}
function hereLoc() {
  if (!navigator.geolocation) return toast('Location not available', true);
  $('#s_gps').textContent = 'Reading GPS…'; let best = null;
  const w = navigator.geolocation.watchPosition(p => {
    if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
    $('#s_lat').value = best.coords.latitude.toFixed(6); $('#s_lng').value = best.coords.longitude.toFixed(6);
    $('#s_gps').textContent = '±' + Math.round(best.coords.accuracy) + ' m ' + (best.coords.accuracy <= 20 ? '✓ good' : '(wait for ±20 m)');
  }, e => { $('#s_gps').textContent = e.message; }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  setTimeout(() => navigator.geolocation.clearWatch(w), 30000);
}
async function saveStore() {
  await act({ action: 'saveStore', store: { code: $('#s_code').value, name: $('#s_name').value, lat: $('#s_lat').value.trim(), lng: $('#s_lng').value.trim(), radiusM: $('#s_rad').value, active: $('#s_act').value } }, 'Store saved');
  closeDrawer();
}

/* ---------------- USERS (admin) ---------------- */
function users() {
  const D = ST.D;
  $('#main').innerHTML = `<div class="card"><h2>Dashboard users</h2>
    <p class="muted"><b>admin</b>: everything. <b>staff</b> (backend team): employees, PINs, review, manual punches, deductions/additions, payroll — not stores or users.</p>
    <table><thead><tr><th>User</th><th>Role</th><th>Active</th></tr></thead><tbody>${D.users.map(u => `<tr><td><b>${esc(u.user)}</b></td><td>${u.role}</td><td>${u.active}</td></tr>`).join('')}</tbody></table>
    <h2 style="margin-top:18px">Add or update a user</h2>
    <div class="form"><label>User name<input type="text" id="u_user" placeholder="e.g. priya"></label>
      <label>Role<select id="u_role"><option>staff</option><option>admin</option></select></label>
      <label>Active<select id="u_act"><option>Yes</option><option>No</option></select></label>
      <label>Password (8+ chars; blank = keep)<input type="password" id="u_pw" autocomplete="new-password"></label>
      <button class="btn y" onclick="saveUser()">Save user</button></div></div>`;
}
function saveUser() { act({ action: 'saveUser', user: $('#u_user').value, role: $('#u_role').value, active: $('#u_act').value, password: $('#u_pw').value }, 'User saved'); }
function pwDialog() {
  openDrawer(`<div class="row"><h2 style="margin:0">Change my password</h2><div class="sp"></div><button class="btn" onclick="closeDrawer()">Close</button></div>
    <div class="form" style="margin-top:14px"><label>Current password<input type="password" id="pw_old"></label><label>New password (8+)<input type="password" id="pw_new"></label></div>
    <button class="btn y" style="margin-top:12px" onclick="chPw()">Change password</button>`);
}
async function chPw() { try { await api({ action: 'changePassword', oldPassword: $('#pw_old').value, newPassword: $('#pw_new').value }); toast('Password changed'); closeDrawer(); } catch (e) { toast(e.message, true); } }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
if (ST.token) load().catch(e => renderLogin(e.message)); else renderLogin('');
</script>
