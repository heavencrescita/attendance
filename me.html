#login .logo{width:116px;height:116px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.45))}
#login h1{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-weight:500;font-size:34px;line-height:1.1;margin:22px 0 4px;text-align:center}
#login p.sub{margin:0 0 26px;color:#cdbfb4;text-align:center;max-width:300px}
.lform{width:100%;max-width:360px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:22px;backdrop-filter:blur(6px)}
.lform label{display:block;font-size:13px;color:#e8dccf;margin:0 0 6px;font-weight:600}
.lform label .ta{color:#b9a99c}
.field{display:flex;align-items:center;background:#fffaf3;border-radius:14px;margin-bottom:16px;border:2px solid transparent}
.field:focus-within{border-color:var(--syrup)}
.field b{color:#8b7b70;padding-left:14px;font-size:19px;font-weight:700}
.field input{flex:1;min-width:0;border:0;background:none;padding:13px 14px 13px 4px;font-size:21px;font-weight:700;letter-spacing:.08em;color:#231713;outline:none}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-syrup{background:linear-gradient(180deg,#f0bb55,#d9982c);color:#2a1a14;box-shadow:0 8px 20px rgba(217,152,44,.35),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-quiet{background:none;color:var(--gold-t);padding:8px 4px;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.wide{width:100%}
.lerr{background:#5a2420;color:#ffd9d4;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.lfoot{margin-top:22px;font-size:13px;color:#b9a99c;text-align:center}
.lfoot a{color:#f0c46e}

/* ---------- app shell ---------- */
.hero{background:linear-gradient(160deg,#3b251c 0%,var(--cocoa) 60%,#1f130f 100%);color:#f6efe6;padding:calc(env(safe-area-inset-top) + 16px) 18px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;opacity:.07;
  background-image:linear-gradient(#fff 2px,transparent 2px),linear-gradient(90deg,#fff 2px,transparent 2px);background-size:22px 22px;transform:rotate(12deg);border-radius:30px}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:1}
.idrow{display:flex;align-items:center;gap:12px}
.idrow .lgimg{width:46px;height:46px}
.idrow .who{flex:1;min-width:0}
.idrow .who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idrow .who span{font-size:13px;color:#cdbfb4}
.mswitch{display:flex;align-items:center;gap:6px;margin-top:20px}
.mswitch button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#f6efe6;border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1}
.mswitch button:disabled{opacity:.3}
.mswitch .m{flex:1;text-align:center;font-weight:700;letter-spacing:.01em}
.takehome{margin-top:16px}
.takehome .lbl{font-size:13.5px;color:#d8c9bd}
.takehome .amt{font-family:var(--serif);font-variation-settings:"SOFT" 100,"opsz" 144;font-weight:500;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin:4px 0 6px}
.takehome .amt.pending{font-size:34px;line-height:1.15;margin:6px 0 8px;color:#f3e6d8}
.takehome .amt small{font-size:26px;vertical-align:.45em;margin-right:4px;color:#f0c46e}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.badge.final{background:rgba(98,201,139,.16);color:#9fe2b8}
.badge.est{background:rgba(240,196,110,.16);color:#f3cf86}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border-top:1px solid rgba(255,255,255,.12)}
.stats div{padding:12px 0 0}
.stats div+div{padding-left:14px;border-left:1px solid rgba(255,255,255,.12)}
.stats b{display:block;font-size:20px;font-family:var(--serif);font-weight:500}
.stats span{font-size:12.5px;color:#cdbfb4}

main{max-width:560px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
.panel{background:var(--surface);border-radius:20px;padding:18px;border:1px solid var(--line);margin-bottom:14px}
.panel h2{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-weight:600;font-size:21px;margin:0 0 4px;letter-spacing:-.005em}
.panel .lead{margin:0 0 14px;color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}

/* ---------- the waffle calendar ---------- */
.waffle{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:12px;border-radius:22px;
  background:linear-gradient(180deg,#d9a24a,#c38a32);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.12),0 10px 24px rgba(160,105,30,.25)}
.waffle .dh{font-size:11px;font-weight:800;text-align:center;color:#5b3a12;opacity:.8;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:9px;position:relative;border:0;padding:0;cursor:pointer;
  background:#b77d2b;box-shadow:inset 0 3px 5px rgba(80,45,5,.55),inset 0 -1px 0 rgba(255,255,255,.25);color:#fff7e8;font-weight:800;font-size:12.5px}
.cell span{position:absolute;left:6px;top:4px;opacity:.9}
.cell.out{visibility:hidden}
.cell.future{opacity:.45;cursor:default}
.cell.full{background:radial-gradient(120% 90% at 30% 25%,#fff3c4 0%,#f6c24e 35%,#d88f17 100%);box-shadow:inset 0 -2px 3px rgba(120,60,0,.35),inset 0 2px 2px rgba(255,255,255,.7);color:#5a3200}
.cell.half{background:linear-gradient(180deg,#b77d2b 0 48%,#f2bb47 48%);box-shadow:inset 0 3px 5px rgba(80,45,5,.45);color:#fff}
.cell.off{background:repeating-linear-gradient(135deg,#c4893a 0 5px,#d9a55a 5px 7px);box-shadow:inset 0 2px 4px rgba(80,45,5,.4)}
.cell.today{outline:3px solid #fff;outline-offset:-3px}
.cell.newmon{box-shadow:inset 0 0 0 2px rgba(90,50,10,.35)}
.cell.newmon.today{box-shadow:inset 0 0 0 2px rgba(90,50,10,.35),0 0 0 3px #fff}
.cell.sel{transform:scale(1.06);z-index:2;box-shadow:0 0 0 3px var(--cocoa),inset 0 -2px 3px rgba(120,60,0,.35)}
.cell i{position:absolute;right:5px;bottom:4px;width:6px;height:6px;border-radius:50%;background:#2a1a14}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend em{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.lg-full{background:radial-gradient(#fff3c4,#f6c24e 40%,#d88f17)}.lg-half{background:linear-gradient(180deg,#b77d2b 50%,#f2bb47 50%)}
.lg-none{background:#b77d2b;box-shadow:inset 0 2px 3px rgba(80,45,5,.5)}.lg-plan{position:relative;background:#b77d2b}.lg-plan::after{content:"";position:absolute;right:2px;bottom:2px;width:5px;height:5px;border-radius:50%;background:#2a1a14}

.day{margin-top:14px;border-radius:16px;background:var(--bg);padding:14px}
.day h3{margin:0 0 6px;font-size:16px}
.shift{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.shift:first-of-type{border-top:0}
.shift .t{font-weight:800;font-size:17px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-mute{background:var(--well);color:var(--muted)}

/* ---------- payslip ---------- */
.slip{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.slip-head{background:var(--cocoa);color:#f6efe6;padding:16px 18px;display:flex;align-items:center;gap:12px}
.slip-head .lgimg{width:40px;height:40px}
.slip-head b{display:block;font-family:var(--serif);font-weight:500;font-size:19px}
.slip-head span{font-size:12.5px;color:#cdbfb4}
.slip-body{padding:6px 18px 16px}
.ln{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.ln .k{flex:1}.ln .k small{display:block;color:var(--muted);font-size:12.5px}
.ln .v{font-weight:700;font-variant-numeric:tabular-nums}
.ln.minus .v{color:var(--bad)}
.sec{font-weight:800;font-size:13px;color:var(--gold-t);margin:14px 0 0}
.net{display:flex;align-items:baseline;margin-top:14px;padding-top:12px;border-top:2px solid var(--ink)}
.net b{flex:1;font-size:16px}
.net span{font-family:var(--serif);font-size:30px;font-weight:600}
.how{font-size:13px;color:var(--muted);margin-top:10px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border:0;background:none;padding:0}
.bar i{display:block;width:100%;max-width:54px;border-radius:10px 10px 4px 4px;background:var(--well)}
.bar.on i{background:linear-gradient(180deg,#f0bb55,#c98a26)}
.bar b{font-size:12.5px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.bar span{font-size:12px;color:var(--muted);margin-top:6px}

/* ---------- shifts ---------- */
.sitem{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.sitem .row b{flex:1;font-size:16px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acc{background:var(--ok);color:#fff}.rej{background:var(--surface);color:var(--bad);border:2px solid var(--bad)}
textarea,.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);font-size:16px}
textarea:focus,.in:focus{outline:none;border-color:var(--syrup)}

/* ---------- me ---------- */
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px}
dl.kv dt{color:var(--muted);font-size:13.5px}
dl.kv dd{margin:0;font-weight:700;text-align:right;word-break:break-word}
.fgrid label{display:block;font-size:13.5px;font-weight:700;margin:12px 0 5px}
.note{border-radius:14px;padding:11px 13px;font-size:14px;margin-top:12px}
.note.ok{background:var(--ok-bg);color:var(--ok)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.warn{background:var(--warn-bg);color:var(--warn)}
.req{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.req:first-child{border-top:0}
.req .tag{align-self:flex-start;flex:none}

/* ---------- tab bar ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{color:var(--syrup-d)}
nav.tabs .dotn{position:absolute;margin-left:18px;margin-top:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.sheet{position:fixed;inset:0;background:rgba(20,10,6,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:0 0 4px}
.skeleton{height:120px;border-radius:20px;background:linear-gradient(90deg,var(--well),var(--surface),var(--well));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}.cell.sel{transform:none}}
@media print{nav.tabs,.hero,.noprint{display:none!important}main{padding:0}body{background:#fff}.panel{border:0}}
</style>

<body>
<section id="login">
  <div class="logo lgimg" role="img" aria-label="The Belgian Waffle Cafe"></div>
  <h1>My BWC</h1>
  <p class="sub">Your shifts, hours and pay in one place<br><span class="ta">உங்கள் வருகை மற்றும் சம்பளம்</span></p>
  <div class="lform">
    <label for="wid">WAFF number <span class="ta">· WAFF எண்</span></label>
    <div class="field"><b>WAFF-</b><input id="wid" inputmode="numeric" maxlength="4" autocomplete="username" placeholder="047"></div>
    <label for="pin">PIN <span class="ta">· 4 இலக்க PIN</span></label>
    <div class="field"><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="••••" style="padding-left:14px"></div>
    <button class="btn btn-syrup wide" id="b-login" onclick="signIn()">Sign in</button>
    <div class="lerr hide" id="e-login"></div>
  </div>
  <div class="lfoot">To punch in or out, use the <a href="index.html">attendance screen</a>.<br>Forgot your PIN? Ask your manager to reset it.</div>
</section>

<div id="app" class="hide">
  <header class="hero"><div class="wrap">
    <div class="idrow"><i class="lgimg" aria-hidden="true"></i><div class="who"><b id="h-name"></b><span id="h-sub"></span></div>
      <a class="btn btn-syrup" href="index.html" style="padding:9px 14px;font-size:14px;text-decoration:none">Punch</a></div>
    <div class="mswitch"><button id="m-prev" aria-label="Previous month" onclick="stepMonth(-1)">‹</button><div class="m" id="m-lbl"></div><button id="m-next" aria-label="Next month" onclick="stepMonth(1)">›</button></div>
    <div class="takehome"><div class="lbl" id="th-lbl">Take-home pay</div><div class="amt num" id="th-amt"></div><span class="badge" id="th-badge"></span></div>
    <div class="stats"><div><b class="num" id="st-days"></b><span>days worked</span></div><div><b class="num" id="st-hrs"></b><span>hours</span></div><div><b class="num" id="st-ot"></b><span id="sl-ot">overtime pay</span></div></div>
  </div></header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
</div>
<div id="sheet" class="sheet hide" onclick="if(event.target===this)closeSheet()"><div class="box" id="sheetbox"></div></div>

<script>
// BWC payroll engine — mirrors the formulas in BWC_Payroll_Sep2026_FINAL_v3.xlsx (SEP-26 PAYROLL sheet).
//  Days worked : shift > halfDayHrs (4 h) = 1 day, 0 < shift ≤ 4 h = ½ day
//  Week-off    : W/O eligible → credit days = min(WkOff, days ≥ workDays ? WkOff : INT((days+1)/7)); hours = days × duty
//  Rate / hr   : eligible → plan ÷ (calDays × duty); not eligible → dailyRate ÷ duty
//  FIXED       : base = plan ÷ workDays × min(days, workDays); no OT
//  HOURLY      : hours = clocked + credit; OT hrs = max(0, clocked − workDays × duty); base = rate × (hours − OT); OT pay = OT × rate × otMultiplier
//  NET         : Inactive → 0, else ROUND((base + OT + additions − deductions) ÷ 10) × 10 (Excel rounding); negative NET carries forward
const COUNTED = ['ACCEPTED', 'APPROVED', 'MANUAL'];
const MAX_SHIFT_MS = 24 * 3600000;   // must match OPEN_SHIFT_MAX_H in Code.gs
const LONG_SHIFT_H = 20;

function istParts(iso) { return { date: iso.slice(0, 10), time: iso.slice(11, 16) }; }

// The 6:00am shift gets a 10-minute grace at clock-in: punching in anywhere from 06:00 to 06:10 still pays as if
// they clocked in at 06:00 exactly. hm is the punch's local "HH:MM"; returns the epoch to use for hours worked.
function graceAdjustEpoch_(epoch, hm) {
  const m = /^06:(0[0-9]|10)$/.exec(hm || '');
  return m ? epoch - Number(m[1]) * 60000 : epoch;
}

// Self-service punch-out stays open until 4:00am (PUNCHOUT_CUTOFF_HM in Code.gs) so closing-up time
// doesn't lock staff into a missed-punchout request, but hours worked still stop counting at 3:00am —
// an OUT anywhere from 03:00 up to the 4am cutoff is paid as if it happened at 03:00 exactly. dateStr/hm
// are the OUT punch's local date/"HH:MM"; returns the epoch to use for hours worked.
function capOutEpoch_(dateStr, hm, epoch) {
  const m = /^(\d{2}):(\d{2})$/.exec(hm || ''); if (!m) return epoch;
  const mins = Number(m[1]) * 60 + Number(m[2]);
  return (mins >= 180 && mins < 240) ? new Date(dateStr + 'T03:00:00+05:30').getTime() : epoch;
}

// Pair punches into shifts for one employee. Returns {shifts, issues}.
function buildShifts(punches, now) {
  now = now || Date.now();
  const ps = punches.filter(p => COUNTED.includes(p.status)).sort((a, b) => Number(a.epoch) - Number(b.epoch));
  const shifts = [], issues = []; let open = null;
  for (const p of ps) {
    if (p.type === 'IN') {
      if (open) issues.push({ kind: 'Missing OUT', punch: open });
      open = p;
    } else {
      if (open && Number(p.epoch) - Number(open.epoch) <= MAX_SHIFT_MS) {
        const i = istParts(open.time), o = istParts(p.time);
        shifts.push({ date: i.date, day: Number(i.date.slice(8, 10)), in: i.time, out: o.time + (o.date !== i.date ? ' +1' : ''),
          hours: (capOutEpoch_(o.date, o.time, Number(p.epoch)) - graceAdjustEpoch_(Number(open.epoch), i.time)) / 3600000, store: open.store, inPunch: open, outPunch: p });
        if ((Number(p.epoch) - Number(open.epoch)) / 3600000 > LONG_SHIFT_H) issues.push({ kind: 'Very long shift — check', punch: open, counted: true });
        open = null;
      } else issues.push({ kind: 'OUT without IN', punch: p });
    }
  }
  if (open) issues.push({ kind: now - Number(open.epoch) > MAX_SHIFT_MS ? 'Missing OUT' : 'On shift now', punch: open });
  return { shifts, issues };
}

// Imported (Excel) shifts → same shape as punched shifts
function importedShifts(rows) {
  return rows.map(r => ({ date: r.date, day: Number(String(r.date).slice(8, 10)), in: r.inT, out: r.outT, hours: Number(r.hours), store: r.branch, imported: true }));
}

function daysInMonth(month) { const [y, m] = month.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function addMonths(month, n) { const y = Number(month.slice(0, 4)), m0 = Number(month.slice(5, 7)) - 1 + n; return (y + Math.floor(m0 / 12)) + '-' + String(((m0 % 12) + 12) % 12 + 1).padStart(2, '0'); }
// Payroll periods run the 15th of one month through the 14th of the next, named for the month they END
// in — period "2026-10" is 15 Sep through 14 Oct 2026 (30 days). Mirrors periodBounds_/periodOf_ in Code.gs.
function periodRange(month) {
  const startDate = addMonths(month, -1) + '-15', endDate = month + '-14';
  const start = new Date(startDate + 'T00:00:00+05:30').getTime(), end = new Date(month + '-15T00:00:00+05:30').getTime();
  return { startDate, endDate, start, end, days: Math.round((end - start) / 86400000) };
}
function periodOf(ymd) { const mo = String(ymd).slice(0, 7), day = Number(String(ymd).slice(8, 10)); return day >= 15 ? addMonths(mo, 1) : mo; }
function excelRound(x) { return Math.sign(x) * Math.round(Math.abs(x) + 1e-9); }

// e: employee row; shifts: that employee's shifts dated inside the month; ctx: {month, cfg, ded, add, weekOff}
function calcPay(e, shifts, ctx) {
  // calDays: pass ctx.calDays explicitly once the caller knows whether this month was paid on the old
  // calendar-month convention or the new 15th–14th cycle (Code.gs computes this from V9Ref history).
  // Falls back to plain calendar days of the named month when not given — e.g. in tests against months
  // that predate the 15th–14th cycle, where that's exactly the right (and only ever used) convention.
  const cfg = ctx.cfg, calDays = ctx.calDays != null ? Number(ctx.calDays) : daysInMonth(ctx.month), workDays = calDays - Number(cfg.weekOffsPerMonth || 4);
  const halfH = Number(cfg.halfDayHrs || 4), otMult = Number(cfg.otMultiplier || 1);
  const duty = Number(e.duty) || 9, plan = Number(e.plan) || 0;
  const worked = shifts.filter(x => x.hours > 0);
  const clockH = worked.reduce((s, x) => s + x.hours, 0);
  const halfDays = worked.filter(x => x.hours <= halfH).length;
  const days = worked.length - 0.5 * halfDays;
  const eligible = e.woEligible !== 'No';
  const woMax = e.woDays === '' || e.woDays == null ? Number(cfg.weekOffsPerMonth || 4) : Number(e.woDays);
  const rate = eligible ? plan / (calDays * duty) : (Number(e.dailyRate) || plan / calDays) / duty;
  const wo = (ctx.weekOff || []).find(w => w.empId === e.id);
  const ruleCredit = eligible ? Math.min(woMax, days >= workDays ? woMax : Math.floor((days + 1) / 7)) : 0;
  const creditDays = wo ? Number(wo.days) : ruleCredit;
  const creditSource = wo ? 'set by ' + wo.setBy : (eligible ? 'rule' : 'not eligible');
  const creditH = creditDays * duty;
  const active = e.status === 'Active';
  let base = 0, otH = 0, otPay = 0, basis;
  if (e.payType === 'FIXED') {

}
const cat = c => ({ 'UNI/HYG/TRNG': 'Uniform, hygiene or training', 'TSHIRT/EQUIP': 'T-shirt or equipment', 'T-SHIRT/EQUIP': 'T-shirt or equipment', 'CASH SHORT': 'Cash shortage', COMPLAINT: 'Customer complaint', DISCIPLINE: 'Discipline', ADVANCE: 'Salary advance' }[c] || c);
const stTag = s => s === 'ACCEPTED' ? '<span class="tag t-ok">Accepted</span>' : s === 'REJECTED' ? '<span class="tag t-bad">Rejected</span>' : '<span class="tag t-warn">Answer needed</span>';

/* ---------- shifts (accept / reject) ---------- */
async function loadShifts() { try { const r = await api({ action: 'staffShifts', id: U.id, pin: U.pin }); U.shifts = r.shifts; render(); } catch (e) {} }
function shiftsTab() {
  const L = U.shifts.filter(s => s.canAnswer), O = U.sh;
  $('main').innerHTML = `<div class="panel"><h2>Planned shifts</h2><p class="lead">Accept the shifts you can work. If you can't, reject and tell your manager why. <span class="ta">ஏற்கவும் அல்லது மறுக்கவும்</span></p>
  ${L.map(s => {
    const open = O.open === s.shiftId; let body = '';
    if (s.status === 'PENDING' || open) body = open && O.mode === 'REJECT'
      ? `<textarea id="fb" rows="2" maxlength="300" placeholder="Why can't you work this shift?"></textarea><div class="ans"><button class="btn btn-ghost" onclick="U.sh.open=null;render()">Back</button><button class="btn rej" onclick="answer('${s.shiftId}','REJECT')">Send</button></div>`
      : `<div class="ans"><button class="btn acc" onclick="answer('${s.shiftId}','ACCEPT')">Accept</button><button class="btn rej" onclick="U.sh={open:'${s.shiftId}',mode:'REJECT'};render();$('fb').focus()">Reject</button></div>`;
    else body = `${s.status === 'REJECTED' && s.feedback ? `<div class="muted" style="font-size:14px;margin-top:4px">Your reason: “${esc(s.feedback)}”</div>` : ''}<button class="btn btn-quiet" onclick="U.sh={open:'${s.shiftId}',mode:''};render()">Change my answer</button>`;
    return `<div class="sitem"><div class="row"><b>${dayLbl(s.date)} · ${s.start}–${s.end}</b>${stTag(s.status)}</div><div class="muted" style="font-size:14px">${esc(s.store)} · ${s.hours} h${s.note ? ' · ' + esc(s.note) : ''}</div>${body}<div class="note bad hide" id="e-${s.shiftId}"></div></div>`;
  }).join('') || '<p class="muted">No shifts planned for you yet. Your manager will add them here.</p>'}</div>`;
}
async function answer(id, ans) {
  const fb = ans === 'REJECT' ? (($('fb') || {}).value || '').trim() : '';
  const eb = $('e-' + id);
  if (ans === 'REJECT' && fb.length < 3) { eb.textContent = 'Write a short reason so your manager can plan around it.'; return eb.classList.remove('hide'); }
  try { const r = await api({ action: 'staffRespond', id: U.id, pin: U.pin, shiftId: id, answer: ans, feedback: fb }); const s = U.shifts.find(x => x.shiftId === id); s.status = r.status; s.feedback = fb; U.sh = { open: null, mode: '' }; render(); }
  catch (e) { eb.textContent = e.message; eb.classList.remove('hide'); }
}

/* ---------- my details ---------- */
const FIELDS = [['phone', 'Mobile number', 'tel'], ['altPhone', 'Other mobile number', 'tel'], ['email', 'Email', 'email'], ['address', 'Home address', 'text'],
  ['emergencyName', 'Emergency contact name', 'text'], ['emergencyPhone', 'Emergency contact number', 'tel'], ['acctName', 'Name on bank account', 'text'], ['bankAcct', 'Bank account number', 'text'], ['ifsc', 'IFSC code', 'text']];
function me() {
  const e = U.D.profile, R = U.D.requests || [];
  const v = k => e[k] ? esc(e[k]) : '<span class="muted" style="font-weight:500">Not added</span>';
  $('main').innerHTML = `
  <div class="panel"><h2>Work</h2>
    <dl class="kv" style="margin-top:10px"><dt>WAFF number</dt><dd>${e.id}</dd><dt>Branch</dt><dd>${esc(e.branchName)}</dd>
      <dt>Pay type</dt><dd>${e.payType === 'FIXED' ? 'Fixed monthly' : 'Hourly'}</dd><dt>${e.payType === 'FIXED' ? 'Monthly salary' : 'Planned monthly pay'}</dt><dd>${rs(e.plan)}</dd><dt>Shift length</dt><dd>${e.duty} hours</dd></dl>
    <p class="muted" style="font-size:13px;margin:12px 0 0">Your manager updates these. If something is wrong, tell your manager.</p></div>
  <div class="panel"><div class="row"><h2 style="margin:0">Personal and bank details</h2><div class="sp"></div><button class="btn btn-ghost" onclick="editSheet()">Update</button></div>
    <dl class="kv" style="margin-top:12px">${FIELDS.map(([k, l]) => `<dt>${l}</dt><dd>${v(k)}</dd>`).join('')}</dl>
    <p class="muted" style="font-size:13px;margin:12px 0 0">Changes go to your manager to approve. Bank changes are checked before your next salary.</p></div>
  ${R.length ? `<div class="panel"><h2>Your requests</h2>${R.map(r => { let d = {}; try { d = JSON.parse(r.data); } catch (x) {}
      const what = r.kind === 'CORRECTION' ? `Punch correction for ${dayLbl(d.date)}, ${d.inT}–${d.outT}` : 'Update ' + Object.keys(d).map(k => (FIELDS.find(f => f[0] === k) || [k, k])[1].toLowerCase()).join(', ');
      return `<div class="req"><div class="sp">${esc(what)}<div class="muted" style="font-size:12.5px">${String(r.createdAt).slice(0, 10)}${r.decisionNote ? ' · ' + esc(r.decisionNote) : ''}</div></div>${r.status === 'PENDING' ? '<span class="tag t-warn">Waiting</span>' : r.status === 'APPROVED' ? '<span class="tag t-ok">Approved</span>' : '<span class="tag t-bad">Not approved</span>'}</div>`; }).join('')}</div>` : ''}
  <div class="panel"><h2>PIN and sign out</h2><p class="lead">Change the PIN you use to punch in and sign in here.</p>
    <div class="row"><button class="btn btn-ghost" onclick="pinSheet()">Change PIN</button><div class="sp"></div><button class="btn btn-quiet" onclick="signOut()">Sign out</button></div></div>`;
}
function openSheet(html) { $('sheetbox').innerHTML = html; $('sheet').classList.remove('hide'); const f = $('sheetbox').querySelector('input,textarea'); if (f) setTimeout(() => f.focus(), 50); }
function closeSheet() { $('sheet').classList.add('hide'); }
function sheetMsg(cls, m) { const n = $('s-msg'); n.className = 'note ' + cls; n.textContent = m; n.classList.remove('hide'); }
function editSheet() {
  const e = U.D.profile;
  openSheet(`<h3>Update your details</h3><p class="muted" style="margin:0 0 6px">Fill in only what you want to change.</p><div class="fgrid">
    ${FIELDS.map(([k, l, t]) => `<label for="f-${k}">${l}</label><input class="in" id="f-${k}" type="${t === 'tel' ? 'tel' : t === 'email' ? 'email' : 'text'}" ${t === 'tel' ? 'inputmode="tel" maxlength="15"' : ''} placeholder="${k === 'bankAcct' ? 'Full account number' : esc(e[k] || '')}" ${k === 'ifsc' ? 'style="text-transform:uppercase"' : ''}>`).join('')}</div>
    <div class="note hide" id="s-msg"></div>
    <div class="ans"><button class="btn btn-ghost" onclick="closeSheet()">Cancel</button><button class="btn btn-syrup" id="s-go" onclick="sendProfile()">Send to manager</button></div>`);
}
async function sendProfile() {
  const data = {}; FIELDS.forEach(([k]) => { const v = $('f-' + k).value.trim(); if (v) data[k] = v; });
  if (!Object.keys(data).length) return sheetMsg('bad', 'Fill in at least one detail to change.');
  $('s-go').disabled = true;
  try { await api({ action: 'staffRequest', id: U.id, pin: U.pin, kind: 'PROFILE', data }); closeSheet(); await load(U.D.month); U.tab = 'me'; render(); }
  catch (e) { sheetMsg('bad', e.message); $('s-go').disabled = false; }
}
function fixSheet(day) {
  const t = todayIST();
  openSheet(`<h3>Report a wrong or missing punch</h3><p class="muted" style="margin:0 0 6px">Tell your manager the times you really worked. They will check and fix your attendance.</p><div class="fgrid">
    <label for="c-date">Date</label><input class="in" id="c-date" type="date" max="${t}" value="${day || t}">
    <div class="ans" style="margin-top:0"><div><label for="c-in">Started at</label><input class="in" id="c-in" type="time"></div><div><label for="c-out">Finished at</label><input class="in" id="c-out" type="time"></div></div>
    <label for="c-why">What happened?</label><textarea id="c-why" rows="3" maxlength="300" placeholder="For example: phone battery died, could not punch out"></textarea></div>
    <div class="note hide" id="s-msg"></div>
    <div class="ans"><button class="btn btn-ghost" onclick="closeSheet()">Cancel</button><button class="btn btn-syrup" id="s-go" onclick="sendFix()">Send to manager</button></div>`);
}
async function sendFix() {
  const data = { date: $('c-date').value, inT: $('c-in').value, outT: $('c-out').value, reason: $('c-why').value.trim() };
  $('s-go').disabled = true;
  try { await api({ action: 'staffRequest', id: U.id, pin: U.pin, kind: 'CORRECTION', data }); sheetMsg('ok', 'Sent. Your manager will review it.'); setTimeout(async () => { closeSheet(); await load(U.D.month); }, 900); }
  catch (e) { sheetMsg('bad', e.message); $('s-go').disabled = false; }
}
function pinSheet() {
  openSheet(`<h3>Change PIN</h3><p class="muted" style="margin:0 0 6px">Use 4 digits that are not easy to guess, like 1234 or 1111.</p><div class="fgrid">
    <label for="p-new">New PIN</label><input class="in" id="p-new" type="password" inputmode="numeric" maxlength="4">
    <label for="p-new2">Type it again</label><input class="in" id="p-new2" type="password" inputmode="numeric" maxlength="4"></div>
    <div class="note hide" id="s-msg"></div>
    <div class="ans"><button class="btn btn-ghost" onclick="closeSheet()">Cancel</button><button class="btn btn-syrup" id="s-go" onclick="sendPin()">Change PIN</button></div>`);
}
async function sendPin() {
  const a = $('p-new').value, b = $('p-new2').value;
  if (a !== b) return sheetMsg('bad', 'The two PINs are different. Type the same PIN twice.');
  $('s-go').disabled = true;
  try { await api({ action: 'staffPin', id: U.id, pin: U.pin, newPin: a }); U.pin = a; sheetMsg('ok', 'PIN changed. Use the new PIN from now on.'); setTimeout(closeSheet, 1400); }
  catch (e) { sheetMsg('bad', e.message); $('s-go').disabled = false; }
}
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
</script>
</body>
</html>
